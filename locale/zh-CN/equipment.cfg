 [fa]
 # 装备动作和状态消息（非UI导航）
 # UI字符串请参考 ui-equipment-grid.cfg
 
 # 护甲状态
 armor-no-armor=未装备护甲。
 armor-equipped=__1__ 已装备，
 armor-equipped-no-grid=__1__ 已装备，但无装备网格。
 armor-no-equipment=无装备附件安装。
 
 # 护甲电力与电池
 armor-batteries-full=电池满，
 armor-batteries-empty=电池空
 armor-batteries-percent=电池电量 __1__%，
 armor-no-batteries=无电池，
 armor-generating=正在发电
 armor-power-nonstop=__1__ 持续运行，
 armor-power-daytime=__1__ 白天供电，
 
 # 护甲加成
 armor-movement-bonus=__2__ 的移动速度加成 __1__%
 armor-shield-empty=，护盾为空
 
 # 装备操作 - 装备
 equipment-equipped=已装备 __1__
 equipment-equipped-swap=已装备 __1__，手持 __2__
 equipment-cannot-insert=无法插入 __1__
 equipment-no-fit=此装备无法放入剩余 __1__ 个槽位中。
 
 # 装备操作 - 移除
 equipment-removed-to-inventory=已将 __1__ 移除到物品栏
 equipment-removed-armor=已移除 __1__
 equipment-cannot-remove=无法移除装备
 equipment-already-marked=已标记为待移除
 equipment-marked-for-removal=已标记为待移除
 equipment-cannot-mark=无法标记为待移除
 
 # 武器和弹药
 equipment-gun-slots-full=所有武器槽已满。
 equipment-ammo-slots-full=所有弹药槽已满。
 equipment-reloaded=已用 __1__ 装填
 equipment-fully-reloaded=已全部装填三种武器
 equipment-reloaded-partial=已用可用弹药装填武器
 
 # 修复功能
 equipment-no-item-to-repair=此槽位无可修复物品
 equipment-item-full-health=__1__ 生命值已满
 equipment-repaired-item=已修复 __1__ 至 __2__% 生命值
 
 # 装备信息展示
 equipment-collected-items=已收集 __1__/__2__ 个物品，
 equipment-collected-stacks=已收集 __1__/__2__ 组物品，
 equipment-shield-percent=护盾 __1__%
 equipment-shield-full=护盾满
 
 # 装备加成展示
 equipment-shield-capacity=__1__ / __2__ 护盾
 equipment-battery-percent=__1__% 电池电量
 equipment-generator-power=__1__ 发电机
 equipment-solar-power=__1__ 太阳能
 equipment-allow-roboport-dispatch=允许个人机器人发送
 
 # 装备错误
 equipment-error-ammo-only=错误：此槽位仅限弹药类型
 equipment-error-gun-only=错误：此槽位仅限武器类型
 equipment-error-incompatible=错误：武器和弹药类型不兼容
 equipment-error-no-grid=错误：__1__ 上无可用装备网格
 equipment-error-no-ammo-found=错误：找不到相关弹药进行装填
 equipment-error-not-enough-slots=错误：空物品栏槽位不足，至少需要6个
 equipment-error-no-character-entity=错误：无角色或实体
 equipment-error-no-armor=无护甲。
 equipment-error-invalid-entity=实体已失效
 
 # 共享消息
 equipment-no-grid=无装备网格。
 equipment-no-character=无角色
 inventory-full=物品栏已满。
 guns-and-ammo=武器和弹药
