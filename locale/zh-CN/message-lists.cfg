[fa]
messagelist--blueprint-book-help--msg1=蓝图书用于组织蓝图。一本书可以包含任意数量的蓝图。
messagelist--blueprint-book-help--msg2=按 Control + Alt + Shift + B 获取空蓝图书。
messagelist--blueprint-book-help--msg3=书有两个子标签页：一个显示书内的蓝图，另一个控制书本本身。
messagelist--blueprint-book-help--msg4=在蓝图标签页中，点击蓝图可将其设为当前激活蓝图。
messagelist--blueprint-book-help--msg5=用 M 和句点在不打开书的情况下循环浏览蓝图。
messagelist--blueprint-book-help--msg6=按逗号可查看地图上哪个蓝图处于激活状态。
messagelist--blueprint-book-help--msg7=右方括号 ] 可提供关于选中蓝图的更多详细信息。
messagelist--blueprint-book-help--msg8=Shift + W/S 可上下拖动调整蓝图顺序。
messagelist--blueprint-book-help--meta=eJyrVkrOL80rUbKy0FHKS8xNVbJSSsopTS0oyswr0U3Kz8/WzUjNKVCqBQAUXg3q

messagelist--bottleneck-analyzer-help--msg1=瓶颈分析器会告诉你哪些合成机器在等待原料。每台组装机和火箭 silo 每5秒检查一次。熔炉被排除在外，因为它们根据现有原料选择配方，燃料也被排除。
messagelist--bottleneck-analyzer-help--msg2=每一行代表一种原料，排在最前面的是让最多机器等待的原料。一行显示它平均让多少台机器等待、曾经有多少台机器缺少它，以及在缺少时每次制造缺多少。
messagelist--bottleneck-analyzer-help--msg3=沿着一行移动可以听到缺少该原料的机器：每台机器正在制作什么、缺少的时间比例，以及它的位置。你当前视图所在表面的机器排在前面，离光标最近的排最前。点击一台机器可以将光标移到它上面，如果它在另一个表面则切换到那个表面。
messagelist--bottleneck-analyzer-help--msg4=在一台机器上按 U 可以朗读缺少原料在该机器表面的生产统计数据。
messagelist--bottleneck-analyzer-help--msg5=Ctrl+Tab 切换时间范围：最近30秒、最近1分钟或最近10分钟。Tab 切换计数范围：所有表面、光标覆盖的大于一个格子的区域下的机器，然后是每个表面单独计算。
messagelist--bottleneck-analyzer-help--msg6=数字在打开分析器时读取，打开期间不会变化。要查看更新后的数字，请关闭再重新打开分析器。
messagelist--bottleneck-analyzer-help--meta=eJyrVkrOL80rUbIy01HKS8xNVbJSSsovKclJzUtNztZNzEvMqaxKLdLNSM0pUKoFAGGZD/k=

messagelist--category-rows-help--msg1=分类行 UI 是一种特殊的多行布局，常见于研究菜单和合成菜单。
messagelist--category-rows-help--msg2=W 和 S 用于在不同行之间切换。
messagelist--category-rows-help--msg3=A 和 D 用于在当前行内向左/向右移动。
messagelist--category-rows-help--msg4=这种布局避免了长菜单的滚动需求。
messagelist--category-rows-help--meta=eJyrVkrOL80rUbIy0VHKS8xNVbJSSk4sSU3PL6rULcovL9bNSM0pUKoFAAWSDY8=

messagelist--ch1--msg1=欢迎进入异星工厂无障碍教程。在开始之前，本章会介绍一些关于异星工厂的知识，讲解如何使用教程界面，并进行几个基本检查。按 W 和 S 键可浏览教程内容。
messagelist--ch1--msg2=请继续前注意，这是入门教程，不会涵盖模组的所有功能。如果想学习此处有意省略的内容，请参阅 GitHub 仓库自述文件中附带的参考文档。教程的最后几章也会对省略的部分做简要介绍。
messagelist--ch1--msg3=要返回本界面，请按 Alt + T。
messagelist--ch1--msg4=按 E 可关闭教程界面，你会回到之前使用的 UI，并记住你的位置以便下次继续。
messagelist--ch1--msg5=E 会打开主菜单（如果没有任何其他界面处于打开状态）。如果在教程关闭时按 E，你就会到达那里。再次按 E 可以退出。
messagelist--ch1--msg6=大多数时候，按 E 会关闭所有已打开的 UI。教程界面是特例——E 只会关闭教程本身。这样你可以在其他菜单打开时阅读教程而不丢失进度。
messagelist--ch1--msg7=按 F1 保存游戏。游戏也会每隔几分钟自动保存一次，会有两声提示音。
messagelist--ch1--msg8=另外，我们的 GitHub 上有本教程的英文 Markdown 文本版本。你也可以通过控制台命令 /fa-tutorial-transcript 生成它。
messagelist--ch1--msg9=在继续之前，很重要的一点是确认你没有启用"太空时代"（Space Age）DLC。如果你有，就需要重建存档。
messagelist--ch1--msg10=如果你没有购买太空时代，这条不适用。
messagelist--ch1--msg11=如果你有，请退出游戏，进入启动器的模组菜单，禁用品质系统、高架轨道和太空时代。
messagelist--ch1--msg12=你可能还想开启和平模式，这样敌人不会主动攻击你，除非你先动手。如果你想这样做，也需要重建存档。
messagelist--ch1--msg13=操作方法是：在启动器菜单中自定义你的存档，进入敌人选项，切换它。如果你在使用指南针峡谷预设，它已经为你设置了。
messagelist--ch1--msg14=教程由章节组成。用 Control + Tab 在各章节间移动。我们称之为标签页。
messagelist--ch1--msg15=每章有 2 个子标签页。只按 Tab 可在它们之间切换。分别是章节文字说明和示例蓝图。我们稍后会详细说明蓝图。
messagelist--ch1--msg16=游戏 UI 的组织方式与此完全相同。
messagelist--ch1--msg17=好了，进入游戏本身。
messagelist--ch1--msg18=异星工厂是一款建造工厂的游戏。你的目标是建立一座能够发射火箭的基地。
messagelist--ch1--msg19=为此，你需要建造实验室，然后放入科学包来进行研究。
messagelist--ch1--msg20=共有 7 种科学包。你最早遇到的是自动化科学包。随着游戏推进，你会解锁更多种类，需要同时把它们都送到同一个地方。这就是异星工厂的核心机制。
messagelist--ch1--msg21=大致来说，每种科学包都会让游戏的复杂度翻一倍。完成前几种相对容易，即使不建工厂耐心也能做到；但最后几种才是真正的挑战。
messagelist--ch1--msg22=如果你不知道下一步该做什么，一个办法是查看哪种科技最贵，或者是否能研究新的科学包。
messagelist--ch1--msg23=当你研究了游戏中大部分科技后，就能制造并发射火箭了。
messagelist--ch1--msg24=也许听起来很简单？但其实不然。此外，你还面临各种敌人，他们很不想让你存在！如果你不在和平模式，还得反击。
messagelist--ch1--msg25=本教程教授的概念与图形化教程相同，只是为音频游玩做了适配。它互动性没那么强，所以我们先用一段简短的讲解来教你如何思考这款游戏。
messagelist--ch1--msg26=异星工厂是一个在嵌套问题中解决问题的游戏。
messagelist--ch1--msg27=首先，你学习基础组件如何工作。
messagelist--ch1--msg28=然后，你把基础组件组合成大约 10×10 规模的小模块，用传送带和机械臂（机器人手臂）来完成某一种产品的制作。
messagelist--ch1--msg29=接着，你用这些小模块拼出更大的模块，把若干东西组合成更复杂的产品。
messagelist--ch1--msg30=随着规模扩大，把所有东西放到同一处或来回运输变得越来越难，所以你的工厂范围不断扩大，同时解锁连接更长距离的工具。
messagelist--ch1--msg31=到游戏后期，科学包需要跨越数百格距离，而建造它们的占地也达数百格。
messagelist--ch1--msg32=地图实际上是无限的，后期基地往往每边都有数百格。
messagelist--ch1--msg33=这对成功玩好异星工厂有几层含义，尤其对盲人玩家而言。
messagelist--ch1--msg34=条理清晰非常重要。找出易于重复拼接的模式也同样重要。后面的教程会帮你掌握一些重复模式。
messagelist--ch1--msg35=玩得好的秘诀是：只要你组织有序，就不需要记住几百个东西的位置。只需要知道"这边做自动化科学包，解决方案长这样"就够了。
messagelist--ch1--msg36=当你回头看时，因为你在小规模上用同样方式解决了问题，你可以快速重新理解整体布局。
messagelist--ch1--msg37=异星工厂作为一款优秀游戏的原因之一，是明眼玩家也用同样的方式游玩。游戏甚至有系统让你保存和快速放置建筑组，称为蓝图。甚至还有剪贴板。
messagelist--ch1--msg38=奖励不是"看我摆了一千个能用的东西"，而是"看我优雅地解决了异星工厂呈现的问题，并将其融入整个工厂"。
messagelist--ch1--msg39=通常，明眼玩家第一次玩时会随意摆放，想到什么放什么。然后逐渐学会更有条理。区别在于，作为盲人玩家，从一开始就保持有条理更重要。明眼玩家可以靠瞥一眼来纠偏，而我们没有视觉扫描能力，这种实时分析非常耗时，所以本教程把这些"如何思考"的内容前置了。
messagelist--ch1--msg40=随着你越来越熟练，设计会越来越依赖重复模式，但这些模式也会变复杂，并且嵌套在更大的结构中。
messagelist--ch1--msg41=好了，是时候迈出第一步了。按 Control + Tab 进入第一个正式章节，开始采集资源和建造你的第一个实验室。
messagelist--ch1--meta=eJyrVkrOL80rUbIyMdRRykvMTVWyUkrOMFSqBQBmfgeQ

messagelist--ch10--msg1=是时候自动化科学包生产了。本章只引入一个新功能：大光标，然后就进入建造环节。
messagelist--ch10--msg2=新功能是所谓"扩大光标"。Shift + I 缩小视野增大光标，Control + I 放大视野缩小光标。
messagelist--ch10--msg3=光标缩小时你会获得该区域的汇总信息，且每次移动步长变大。例如大小为 3 时，每步移动 3 格，同时看到以光标为中心的 3×3 区域汇总。
messagelist--ch10--msg4=本章的目的是找一个合适的建造地点。
messagelist--ch10--msg5=Control + Shift + I 切换战斗模式。开启后光标停止工作，很多按键含义改变。误触时再按一次即可退出。
messagelist--ch10--msg6=先找一片空地建造。岩石和树木可以，悬崖和资源矿床不行。不能建在悬崖上，建在矿床上日后还得拆了换成钻头。
messagelist--ch10--msg7=自动化科学包配方是 1 块铜板 + 1 个铁齿轮；铁齿轮配方是 2 块铁板。
messagelist--ch10--msg8=所以 1 个自动化科学包需要 2 块铁板和 1 块铜板。要合成 100 个就需要 200 块铁板和 100 块铜板，以此类推。
messagelist--ch10--msg9=现在可以合成组装机 1 了（前提是已完成自动化研究）。做 2 台组装机、2 根机械臂、2 根电线杆。记住电线杆每次合成得 2 根。
messagelist--ch10--msg10=组装机是合成机器的一种，异星工厂中很多建筑都是如此。之前我们讲过按 K 可以查看哪些机器能合成某物品。
messagelist--ch10--msg11=组装机可以合成合成菜单显示它能合成的任何物品。
messagelist--ch10--msg12=稍后你会解锁无法手搓的配方，必须用机器制作，就像冶炼必须在炉子中进行一样。你也会解锁需要更高级甚至特定机器的配方。
messagelist--ch10--msg13=机器之间的另一个区别是合成速度。组装机 1 的合成速度是你的二分之一。放置后可右键点击机器查看详细参数。
messagelist--ch10--msg14=现在你需要把电线杆延伸到空地区域。涉及多根电线杆时要知道：按 N 会告诉你它连接到哪些其他电线杆。提醒一下，Build Lock 会把电线杆放在最大距离处，放置时自动连接到范围内所有其他电线杆。
messagelist--ch10--msg15=与机械臂可以从传送带取放不同，它们也能在机器之间搬运。玩家称这种设计为直插式连接。我们从西向东布置。
messagelist--ch10--msg16=注意同样附有蓝图的正常工作示例。
messagelist--ch10--msg17=首先放置一台组装机，它是 3×3 大小。向右数 4 格放置第二台。
messagelist--ch10--msg18=这是完美一行，中间有 1 格间隔。在这个格子里放一根机械臂和一根电线杆。
messagelist--ch10--msg19=电线杆同时给两台机器和机械臂供电。
messagelist--ch10--msg20=接着同理：从第二台机组的西北角再向右数 4 格，放置实验室，同样是 3×3。
messagelist--ch10--msg21=中间也留一格放机械臂和小型电线杆。
messagelist--ch10--msg22=然后需要把一路线杆接到这套设施 7 格以内，这样就连入电网。
messagelist--ch10--msg23=最后开启设备。
messagelist--ch10--msg24=点击未配置的组装机直接打开配方选择器，操作方式与合成菜单相同。包括搜索功能，在所有模组 UI 中都有效。点击第一台设为铁齿轮配方，第二台设为自动化科学包配方。
messagelist--ch10--msg25=接下来用 Control 左键智能插入。往铁齿轮组装机里智能插入一批铁板，往自动化科学包组装机里智能插入一批铜板。
messagelist--ch10--msg26=配置完成后有物品栏。再次点击可查看第一个标签页是输入槽，按 Control + Tab 切换到建筑配置来改配方。
messagelist--ch10--msg27=注意这需要一点时间，如果太快可能看不到物品栏。
messagelist--ch10--msg28=第一个物品栏是输入端，模组会告诉你接受什么。配置完成后组装机只接受当前配方所需物品。
messagelist--ch10--msg29=选好科技开始研究。这台组装机每 10 秒产出 1 个自动化科学包（配方耗时 5 秒，但机器速度减半），所以研究耗时至少是科学包需求 × 10 秒。
messagelist--ch10--msg30=铁齿轮机经常会报"输出已满"，这是正常的。因为铁齿轮配方只需 0.5 秒（在机器中需 1 秒，因为比人慢两倍）。所以单台齿轮组装机最多满足 10 台自动化组装机的需求。
messagelist--ch10--msg31=现在没必要建满 10 台。前期科技便宜，等基础解锁完再说更好。
messagelist--ch10--msg32=继续的话应该花些时间练习。此时你可以解锁所有仅需自动化科学包的科技，虽然慢一些。
messagelist--ch10--msg33=最重要的两个科技——也是本教程必需的——是物流学和电动采矿钻。尽快完成这两个，然后再回来进行下一章。
messagelist--ch10--msg34=等待期间有几个选择。
messagelist--ch10--msg35=一是更多钻孔和冶炼炉设在矿床上，获取更多板材。这个设置会极快消耗板材，你可能不够用。记住复制/粘贴存在。可以复制单套炉钻组合多次，再复制更大的方块，依此类推。
messagelist--ch10--msg36=二是建造更多相同的实验室+组装机套装，加速研究。前提是有足够板材。
messagelist--ch10--msg37=三是右键电线杆会发现提示你几乎用完了所有可发电量。在第一台锅炉旁边再放一台同向放置的，它会自动从第一台接收水。这样即可扩展电力。
messagelist--ch10--msg38=本章还附了一份电力系统蓝图：含 2 台锅炉、4 台蒸汽机和 2 根电线杆。
messagelist--ch10--msg39=把它拿来两端给水，两台锅炉都接水（锅炉互相传水），四台蒸汽机都在电线杆覆盖下。
messagelist--ch10--msg40=稍微修改这份蓝图可以做成可平铺版本。如果你的翻译工具把那词搞乱了，它是 tileable 的。可平铺蓝图意思是多个副本并排放置就能自动连通无需额外操作。
messagelist--ch10--msg41=这类例子之前见过：传送带复制/粘贴模式和钻+炉组合都是可平铺的，虽然彼此不交互。
messagelist--ch10--msg42=此时真正只需要 2 台蒸汽机，稍微低效一些是为了给你后续最优方案。
messagelist--ch10--msg43=既然开始扩展规模，提一下：单台离岸水泵可满足 200 台锅炉，每台锅炉供 2 台蒸汽机。由于蒸汽机能互连，经常形成"一台锅炉+两台蒸汽机"堆叠的结构反复出现。
messagelist--ch10--msg44=问题是每台蒸汽机都必须在电线杆供应范围内才能贡献功率。由于它们宽 3 格，电线杆可以跨两根互相连接，但一台蒸汽机一侧的电线杆够不着相邻的另一台。
messagelist--ch10--msg45=因此每隔一段要留空隙让电线杆到位。看蓝图配合这段文字会清晰很多。但这只是教程不是攻略，自己发现这些布局是游戏的重要部分。
messagelist--ch10--meta=eJyrVkrOL80rUbIyMdVRykvMTVWyUkrOMDRQqgUAbj8HxA==

messagelist--ch11--msg1=如果你一直跟着教程走，现在应已解锁以下配方：电动采矿钻、长臂机械臂、分拣器和地下传送带。本章讲解前两者，下一章回顾传送带。
messagelist--ch11--msg2=此时你已经掌握所有核心模组功能。剩余教程章节将讲解较复杂的游戏机制和模组特定用途。
messagelist--ch11--msg3=为了引入长臂机械臂和电动采矿钻，我们现在来讲扩展和自动化冶炼。
messagelist--ch11--msg4=电动采矿钻类似燃烧式采矿钻，但使用电力驱动。
messagelist--ch11--msg5=还有两个重要区别：尺寸是 3×3 而非 2×2，开采范围是 5×5。放置后会挖掘正下方及四周各一格的所有内容。
messagelist--ch11--msg6=如果把两台钻头紧贴放在一起没有间隔，它们会共享部分格子。这没问题，对钻头没有任何惩罚。覆盖矿脉最快的方法就是尽量用这种方式多排钻头。
messagelist--ch11--msg7=但由于电动采矿钻开采范围更大，它可以采到已被放置的传送带和电线杆下方的资源。
messagelist--ch11--msg8=和燃烧式钻头一样，电动采矿钻也直接向地面输出物品。但这次是从北侧中心吐出，而非角落。
messagelist--ch11--msg9=也可以让它直接供给炉子或箱子。
messagelist--ch11--msg10=燃烧式钻头更慢、更小、需要煤。因此要扩展冶炼，必须把煤运到铁矿和铜矿处再喂入钻头。
messagelist--ch11--msg11=继续前进，选一块地方建造冶炼区。这里会有炉子、传送带和机械臂。宽度 10-20 格、长度 20+ 格就足够了。如果全部朝北，那就是一个细长矩形。
messagelist--ch11--msg12=放置钻头，拉电线过去，然后铺一条长传送带到冶炼区。
messagelist--ch11--msg13=接着在你的煤矿上也放一台钻头，再铺一条传送带到冶炼区。
messagelist--ch11--msg14=现在是时候介绍警告菜单了。按 P 打开警告列表。这些对长期游玩帮助不大，但最有用的是找出哪些设备还没通电。
messagelist--ch11--msg15=接下来讲长臂机械臂。长臂机械臂与机械臂工作方式相同，但它从正前方恰好 2 格外拾取，向正后方恰好 2 格投放。
messagelist--ch11--msg16=也比普通机械臂略快。
messagelist--ch11--msg17=强调长臂机械臂的优势：不管中间有什么都能跨过去。可以跨越其他机械臂、传送带、箱子等，从不提前停下。
messagelist--ch11--msg18=这意味着在一台 3×3 机器（如组装机）的一侧最多可以放 6 台而不是 3 台！放两排长臂机械臂时它们会交叉传递物品。
messagelist--ch11--msg19=这里有很多有趣的进阶技巧可以通过不同方式组合传送带和长臂机械臂来发现。
messagelist--ch11--msg20=但现在我们在意的是：在同一侧并排放置一台普通机械臂和一台长臂机械臂，可以让两条不同物品的传送带并行经过机器侧面。
messagelist--ch11--msg21=如果你有一条煤传送带和一条铁矿石传送带，配合这种方式可以把两种原料都送入炉子。
messagelist--ch11--msg22=在深入之前，两个警告。
messagelist--ch11--msg23=第一，电动采矿钻耗电量很大。要注意监控电力。
messagelist--ch11--msg24=第二，如果用电动采矿钻挖煤且电力中断，那么在手动加煤恢复前将完全没有电力。更糟的是，如果在满负荷运行，可能没有足够电力让钻头可靠启动，导致工厂无法重启。这点值得展开说明。
messagelist--ch11--msg25=如果用电动采矿钻挖煤，崩溃过程是这样的：工厂耗尽所有电力 → 钻头减速 → 供给发电厂的煤减少 → 发电机输出功率下降。
messagelist--ch11--msg26=在此过程中，所有传送带逐渐清空，机器消耗原料却得不到补充。
messagelist--ch11--msg27=当你试图修复时，所有钻头、组装机、机械臂全部启动拼命填满空传送带。这会消耗比以往更多的电力，从而加大对煤矿发电机的需求。
messagelist--ch11--msg28=如果不幸遇到这种情况，系统无法满足电力需求，几乎立刻就会耗尽煤炭。然后又重复上述循环。
messagelist--ch11--msg29=正因为如此，燃烧式采矿钻仍有其地位，即使你最终只用少数几台。至少它们作为重要备份确保蒸汽机始终有煤可用。很多玩家干脆只用燃烧钻挖煤完全不在乎这个问题。
messagelist--ch11--msg30=much much later 你可能需要比燃烧钻所能提供的更多的煤，但那时尚早担忧。届时你应该已经扩张到有第二个煤矿，可以专门划一个给动力使用。
messagelist--ch11--msg31=如果你想自行探索游戏，到这里就可以停了。本章其余部分讨论这些机制的实际应用，包含大量剧透但没有新的模组功能。
messagelist--ch11--msg32=本章附有示例蓝图，是一个 7 宽 × 3 高可平铺的熔炼模块。左侧两条北向输入传送带，右侧一条南向输出传送带。
messagelist--ch11--msg33=其中一条输入传送带供煤，另一条供矿石，顺序无所谓。
messagelist--ch11--msg34=接通电线后，炉子会一直冶炼直到输出传送带装满。
messagelist--ch11--msg35=此蓝图之所以可平铺，是因为向北放置副本时通过延伸输入和输出传送带与前一台对接。
messagelist--ch11--msg36=输出朝南是为了靠近输入端。这种布局让你无限增长而无需调整输出位置。
messagelist--ch11--msg37=实际上算一下就知道，单条基础传送带最多支撑 48 座石炉，之后你会升级为钢炉（速度快一倍），所以超过 24 座炉子 per belt 就是浪费。但目前勉强支持一两台。
messagelist--ch11--msg38=健康的工厂有两个特征：基础机器产量不低于消耗量；科学包机器始终保持繁忙。
messagelist--ch11--msg39=还有很多其他考量，比如是否生产的科学包超出使用量。很容易不知不觉造得过多，要小心。
messagelist--ch11--msg40=考虑增加冶炼能力时你会观察到两点：第一，手持板材或在合成菜单中按 U 会显示产量等于消费量；第二，很多机器因缺原料闲着。
messagelist--ch11--msg41=这种情况下需要从后往前查找到第一个停摆的节点。早期工厂无分支结构，这就是最后一个仍在运行的工件之后的一环，通常称为瓶颈。
messagelist--ch11--msg42=也可以用 U 的生产信息来辅助判断。反直觉的是，工厂最后一段正常工作的部分往往是满速运行的。
messagelist--ch11--msg43=回溯时有时会发现瓶颈就在熔炼环节。这时可以叠加本章的蓝图。
messagelist--ch11--msg44=有时还要再往回一步才发现需要更多钻头。下一节讨论这个。
messagelist--ch11--meta=eJyrVkrOL80rUbIyMdFRykvMTVWyUkrOMDRUqgUAbjIHxA==

messagelist--ch12--msg1=是时候回顾传送带了。这是异星工厂中仅次于火车的第二复杂主题。本教程不教火车，也不建议首周目使用。越过这些概念后你基本可以通关。
messagelist--ch12--msg2=本章附带大量示例蓝图展示各种结构的正确布局，所以我们不再逐一详细说明。
messagelist--ch12--msg3=你需要知道的是：所有结构都从南侧输入。
messagelist--ch12--msg4=此时应该已经解锁了分拣器和地下传送带。
messagelist--ch12--msg5=你可能已遇到问题：有时传送带需要交叉。这由地下传送带解决。
messagelist--ch12--msg6=规则是：地下传送带的入口和出口朝向与常规传送带单元相同，但如果出口在入口范围内它们会在地下连接，类似地下管道。区别是两端不指向相反方向。
messagelist--ch12--msg7=建造有点奇怪。入口和出口都通过放置地下传送带来实现，是同一种物品。如果放置位置构成有效出口就自动转为出口，否则成为入口。
messagelist--ch12--msg8=除了理解如何放置外，地下传送带没什么复杂的。只需知道不能混用不同等级的地下传送带。后期会解锁更快的传送带，例如快频地下传送带只能连其他快频地下传送带。
messagelist--ch12--msg9=想象成不同深度的隧道就很准确。虽然视觉上不是这样表现，但你可以做所有不同深度隧道能做的事。也可以理解为调频的瞬移器之类。
messagelist--ch12--msg10=实际上有我们不教的进阶技巧，允许在同一条线上放多个地下传送带，让多条传送带穿过单格宽的线路。原版没有实际用途，但想挑战的话可以试试理解原理。
messagelist--ch12--msg11=如果形成十字交叉形状，南北对走南北向，东西对走东西向，它们在地下互不干扰。
messagelist--ch12--msg12=接下来讨论的分拣器是一个 2×1 格的实体。把较长维度视为宽度。所以朝北放置时东西向更宽，传送带从南边流入。
messagelist--ch12--msg13=分拣器前后各有两个连接点可以理解为接口。
messagelist--ch12--msg14=放在分拣器后面且朝向与其一致的传送带会与它连接。
messagelist--ch12--msg15=前方比较复杂。前面的传送带总会以某种方式连接。如果你放一条东西向的长直传送带会产生侧载（sideload）。如果放两条向外指的传送带可以直接分成两个拐角。我们稍后讲侧载，先保持简单——输出格始终放同向传送带即可。
messagelist--ch12--msg16=分拣器有些有趣特性。首先名字起得不太好。只有当它背后有一条传送带、前面有两条时才真正发挥分拣作用。
messagelist--ch12--msg17=如果背后两条前面一条则变成合并器。
messagelist--ch12--msg18=如果四个格子都有传送带，实际做的是平衡。假设背后两条传送带一条很满另一条几乎空，分拣器会分流 traffic 而非分流 belt——两条输出传送带上物品数量均衡，即使输入不平衡。
messagelist--ch12--msg19=必须强调的一个重要点是：分拣器会毫无保留地混合不同物品的传送带。如果在它背后放两条纯单一物品的传送带但物品不同，两条输出都会按某种比例混合两种物品。
messagelist--ch12--msg20=一般永远不要在一条 Lane 上混合多种物品，而分拣器很容易让你无意犯错。
messagelist--ch12--msg21=分拣器还有配置面板，点击打开。小心：如果把传送带放到分拣器上面，游戏会把分拣器变回普通传送带，所以要用空手操作。
messagelist--ch12--msg22=标签告诉你按哪些键做什么，我们不做具体说明，只描述功能和物品选择器。
messagelist--ch12--msg23=分拣器有输入优先级。设置后它会优先从该侧取物，不用另一侧直到这边没东西。
messagelist--ch12--msg24=例如多矿汇聚时使用可以让特定矿井优先排空。
messagelist--ch12--msg25=分拣器也有输出优先级，功能类似。优先侧有空位时先给它物品。
messagelist--ch12--msg26=第三个功能是过滤。设好输出优先级后再按一次优先级按钮进入过滤器。
messagelist--ch12--msg27=这打开物品选择器，是一个树形控件。左右移动切换分类，向下深入直到最底部的具体物品。和其他菜单一样支持搜索。
messagelist--ch12--msg28=按 Backspace 清除过滤。
messagelist--ch12--msg29=过滤开启后输出优先级不再是"优先级"，而是"过滤方向"。
messagelist--ch12--msg30=假设对朝北分拣器的左侧输出设为铁板过滤。那么西侧输出会有铁板，东侧输出会有除铁板外的所有东西。
messagelist--ch12--msg31=需要时非常有用，但不要滥用。一个很好的用法是处理重叠矿脉。
messagelist--ch12--msg32=之前说过钻头乐于从多个资源采矿。带过滤的分拣器可以解决这个问题：把偶尔混入其他物品的传送带分类。
messagelist--ch12--msg33=但要深刻理解这一点：如果铁板往左走，就永远不会往右。这意味着如果分拣器背后的传送带全装满铁矿而过滤侧的输出也满了，分拣器会卡住——铁过不来，另一条又一直是空的。
messagelist--ch12--msg34=这就是为什么不能滥用或把所有物品放一条传送带到最后再统一分拣。
messagelist--ch12--msg35=它们在高吞吐量分岔口排序效果非常好。例如铁板和铜板可靠分离，因为两侧都被工厂快速消耗总有空闲空间。
messagelist--ch12--msg36=构建更复杂设施时可能想知道内部情况。为此我们有传送带分析器。点击任意传送带打开。
messagelist--ch12--msg37=模组截取当前状态快照并呈现给你。提供四个标签页：本段、上游、下游、总计。
messagelist--ch12--msg38=本段逐格显示当前传送带上的物品分布。
messagelist--ch12--msg39=其余三个标签页显示总计数量。总计数包含全部，上游是后方，下游是前方。
messagelist--ch12--msg40=分析在遇到多进多出（分拣器以及下文内容）和 outgoing sideloads 时停止。不考虑其他传送带侧载进来的部分。基本上把它看作一根长的直线段。
messagelist--ch12--msg41=对高级玩家来说这大致匹配电路网络定义，但不保证完全一致。
messagelist--ch12--msg42=注意有时传送带分析器中百分比超过 100% 是正常的，这是因为游戏有时允许短暂超额。GitHub 文档中有详细解释，但影响微乎其微。
messagelist--ch12--msg43=现在来讲 Lane 和侧载，本章之前不得不使用的术语。你可能注意到传送带有左右之分，机器往往只填满一侧。
messagelist--ch12--msg44=传送带花一份钱买两份。放置时得到两条半格宽的 Lane 而非一整格，每条 Lane 独立。
messagelist--ch12--msg45=Lane 从不意外混合，即使在分拣器中也是如此。所以每条传送带最多容纳两件物品而不卡顿：左边一件右边一件。
messagelist--ch12--msg46=拐角处两条 Lane 同时转弯。
messagelist--ch12--msg47=北的左边是西，南的左边是东，以此类推。想象自己朝传送带方向站立，传送带的左就是你的左手边。
messagelist--ch12--msg48=异星工厂中传送带和火车都需要这种变换能力，所以我们不按东西南北汇报。练一段时间后脑中就能完成转换。
messagelist--ch12--msg49=把物品放上传送带的规则很简单：机械臂总是尽力伸到最远。所以在传送带左侧的机械臂会把物品放到右侧 Lane。
messagelist--ch12--msg50=可以拿箱子和机械臂练习看看会发生什么。
messagelist--ch12--msg51=对于钻头，从钻头起始的传送带会使用右侧 Lane，否则会放在钻头接触的 Lane。要理解这点想想在多台钻头前铺一直线传送带会发生什么。
messagelist--ch12--msg52=事实上你确实应该这么做，这是扩展采矿的方式。
messagelist--ch12--msg53=Lane 变得复杂的地方在于：没有形成拐角的相邻传送带会以多种方式交互。
messagelist--ch12--msg54=如果放一条向北的长传送带再从侧面接触另一条，第二条会把物品倒进去。模组会提示第二段在倾倒，第一段在侧载。
messagelist--ch12--msg55=在这种配置下，水平传送带的两条 Lane 都会灌满垂直传送带的左侧 Lane。
messagelist--ch12--msg56=因为传送带匀速运动，单条 Lane 吞吐量减半，所以你可能制造了瓶颈。基础传送带每分钟 900 件，但单 Lane 只有 450。侧载即意味着牺牲一半吞吐。
messagelist--ch12--msg57=换来的是可以在不混合 Lane 的情况下让多于一种物品上线。
messagelist--ch12--msg58=可以从两侧同时侧载，借此把两条普通传送带合并为一条。
messagelist--ch12--msg59=这样做后能可靠地在一条机械臂前拿到最多 2 种不同物品。
messagelist--ch12--msg60=配合长臂机械臂和一些拼装 puzzle，只用一侧就能把 4 种原料送入同一台机器。
messagelist--ch12--msg61=不过有三个特殊情况需要更多说明。
messagelist--ch12--msg62=第一，你几乎不应该把侧载接到地下传送带入口或出口。那样会堵塞一条 Lane 导致无法前进，因为游戏设计是让靠近地下入口的 Lane 撞在看似隧道的墙壁上而不是继续前进。
messagelist--ch12--msg63=如果不明白也没关系，重要的是除非你是尝试巧妙 trick 的高级玩家否则不要这么做。
messagelist--ch12--msg64=第二，侧载到拐角或试图用传送带末端形成侧载时会发生什么。
messagelist--ch12--msg65=规则是：传送带倾向于保持直线。如果放两段朝北的传送带然后尝试从西侧侧载，得到的是西侧侧载而非南侧。因为可能形成拐角的那一段后面有东西支撑，给了它选择保持直线的选项。做出选择时每段传送带都会优先直线。
messagelist--ch12--msg66=第三也是最重要的情况，模组给它起了个名字：merge（合并）。技术上就是特殊位置的雙侧重载，但也是最重要的传送带技巧。
messagelist--ch12--msg67=当你从东侧转北向然后再从西侧侧载这个拐角时，拐角不再是拐角而变成带两个侧载的直线段。
messagelist--ch12--msg68=因为直线段后方没有任何东西，可以确定这条传送带安全地合并了两条输入传送带：左 Lane 一条右 Lane 一条，绝不混杂其他内容。
messagelist--ch12--msg69=模组通过说"merge"来帮你识别这种情况。
messagelist--ch12--msg70=合并就是你把 4 条同类物品传送带变成 2 条各含两种物品传送带的关键手段。之所以这么说，是因为到了 4 种物品送同一台机器时就非用不可。
messagelist--ch12--msg71=本章结束前还有个关于蓝图的特别事项不方便归入任何地方。
messagelist--ch12--msg72=本章含一个带钻头的示例蓝图。正常情况下不能在普通地面上放置钻头，必须建在资源矿床上。
messagelist--ch12--msg73=蓝图也如此，但游戏不会报错，只是忽略无法放置的钻头。
messagelist--ch12--msg74=这让玩家可以拥有可重复使用的采矿蓝图无需关心矿脉形状是否匹配。
messagelist--ch12--msg75=不想看剧透的到此为止。后面几节虽不长但提供了一个核心问题的解决方案，适合那些 otherwise 找不到组织方法的人。
messagelist--ch12--msg76=这个方案叫总线（bus）。玩家采用这个词来描述此策略。
messagelist--ch12--msg77=做法是建若干条平行长线，彼此间隔几格。
messagelist--ch12--msg78=总线中的每条传送带承载一种材料，记住顺序即可。例如朝东布置时从北到南依次是铁、铜、齿轮等。
messagelist--ch12--msg79=因为记得顺序，任何物品都知道需要哪几条。用分拣器取出所需。然后用地下传送带穿过总线下方，从侧面搭建小模块。总线朝东的话就每隔一段向上建一小簇机器塔。
messagelist--ch12--msg80=然后转身给总线新增 Lane，从这些子工厂的输出端开始，每次增加新功能就把总线加宽一 Lane。
messagelist--ch12--msg81=这个策略单调且不唯一，也有些缺点。
messagelist--ch12--msg82=最大缺点是总线前端的物品优先获取资源，所以供应不足时工厂末端的设备经常跑不起来。
messagelist--ch12--msg83=第二个缺点是需要把科学包传送到实验室，通常意味着要反向铺设一些总线 Lane。
messagelist--ch12--msg84=你会很快学到：超长传送带传递物品很慢。几百格之后一旦出问题，重启整个过程需要极长时间。物品要慢慢沿总线往下传，科学包还得原路返回。
messagelist--ch12--msg85=最终还要沿总线输送流体，就得对付水泵和管道。
messagelist--ch12--msg86=但它对你的优势是：肯定能工作且容易讲解。卡住了就用总线，简单粗暴不需要太多创造力。
messagelist--ch12--msg87=其他解法包括建一堆小型工厂（比如"自动化科学包工厂"）、用火车做复杂操作、把矿石和冶炼移到需求机器旁全程直插、或者缓慢推进直到解锁物流机器人彻底放弃传送带。
messagelist--ch12--msg88=如果你读了这部分，选择基本上是：想要创意冒险还是直接抓个能跑的套路通关。
messagelist--ch12--meta=eJyrVkrOL80rUbKysNBRykvMTVWyUkrOMDRSqgUAbrkHzQ==

messagelist--ch13--msg1=教程给了你示例蓝图。是时候学习自己制作蓝图了。本章重要但也可选，想回头补也行。
messagelist--ch13--msg2=异星工厂有三种统称规划师的物品：拆除规划师、升级规划师和蓝图。三种工作方式相同：手持其一，点击矩形两角选定区域，然后执行对应操作。
messagelist--ch13--msg3=升级和拆除规划师配合大光标使用时会作用于光标覆盖的所有对象，适合选择性清理区域而无需精确计算四角，比如清理森林。
messagelist--ch13--msg4=获取升级规划师按 Alt + U，拆除按 Alt + D，蓝图按 Alt + B。
messagelist--ch13--msg5=使用升级规划师时默认标记所有可升级对象：传送带升下一级，机械臂升为快速型等。我们通过右键暴露有限形式的明眼版配置界面。
messagelist--ch13--msg6=拆除规划师标记待拆区域，标记后对象停止运作等待移除。两种情况下对标记对象调用巡航控制即可执行动作。但已知升级传送带有难以修复的 bug 偶尔遗漏片段，解锁建筑机器人前最好沿预期升级过的传送带用光标跳过检查一遍。
messagelist--ch13--msg7=两者都是临时性的，可存入物品栏，但按 Q 就消失。修改过配置则视为永久保留，改回默认也算修改，删除需按 Control + Backspace。选择第二个点时按住 Shift 可取消区域内所有拆除或升级指令。
messagelist--ch13--msg8=升级/拆除规划师的配置仍在积极开发中，自定义配置支持维护带宽有限，目前已知有 bug 和不稳定因素，请自行斟酌使用。
messagelist--ch13--msg9=回到蓝图。你已学会使用但还不知道怎么做。与其他规划师一样选中两角创建蓝图，但这次保存数据而非执行。第一次按 Alt + B 获得空白蓝图，暂时性；选定范围后才变为永久，清空手部后进入物品栏。
messagelist--ch13--msg10=蓝图也有配置菜单。手持蓝图且所有 UI 关闭时右键打开。可以设置名称和描述、导出到剪贴板，也可导入——粘贴字符串后按 Enter 覆盖当前数据。
messagelist--ch13--msg11=要删除规划师：手持且所有 UI 关闭时，或在物品栏中选择它，然后按 Control + Backspace（危险删除），用于不可撤销的操作。地图上危险删除作用于手中对象，UI 中作用于选中对象；不支持时无论手中有什么都不会发生。
messagelist--ch13--msg12=虽然你可能尚未做过且很久以后才会做，但模组支持放置地砖。此时要注意一个额外功能：默认蓝图不包含地砖，除非周围无建筑；以右键结束选择可弹出含复选框的菜单，其中"始终包含地砖"默认关闭。除地砖外还支持载具中的燃料等后期更有用的内容。与升级/拆除规划师不同此界面完整且稳定。
messagelist--ch13--msg13=蓝图未整理是个问题——无法访问蓝图库始终占用槽位。明眼玩家把蓝图放入蓝图书，模组也支持。书仍占一个槽但可装任意数量蓝图；对明眼玩家而言大部分时间完全不占槽。获取书按 Control + Alt + Shift + B。
messagelist--ch13--msg14=书的界面在第一标签页下有两个子标签：显示书内蓝图和操作书本本身。和蓝图一样书可以命名和导出。在设置行中使用"向右移动并点击添加库存中的蓝图"可将蓝图移入书中。书中每个蓝图右侧有操控命令；按 Shift + W/S 可上下拖动调整顺序。用书建造略有不同：书有"当前激活蓝图"概念，通过在菜单中点击设定。想知道地图上哪个处于激活状态按逗号；不打开书循环浏览按 M 和句点。这三个键你在分拣器 UI 中也见过；模组用 M、逗号、句点作为上下文敏感按键后续还会多次出现尤其在火车和电路网络中。你也可以把升级和拆除规划师放进书中切换到它会当作手持使用但对默认规划师用处不大可通过 alpha 级配置对话框或从明眼玩家处导入字符串建立其他设置的规划师库。最后书及其他规划师类物品可放到快捷栏但与明眼玩家不同仍占用物品栏槽位遗憾的是目前无法把书内的蓝图直接放到快捷栏。
messagelist--ch13--meta=eJyrVkrOL80rUbIyNNFRykvMTVWyUkrOMDRWqgUAbgUHww==

messagelist--ch14--msg1=恭喜完成教程主体。你现在有足够的知识游玩乃至通关。本章是一系列零散的重要说明合集，不适合归入其他章节但你独自很难发现，每条仅几段。之后的教程要么剧透要么讨论后期机制。
messagelist--ch14--msg2=提醒一下：GitHub 上有参考文档包含完整按键列表和参考式说明。
messagelist--ch14--msg3=第一条也是最重要的一条是无障碍雷达。我们之前承诺解释却忘了——因为它一直在默默工作，只要你按建议放置用来测试电力即可。
messagelist--ch14--msg4=异星工厂把 32×32 格区域称为 chunk（区块）。地图由区块组成。游戏需要更多地图时就生成更多区块。区块可能可见、已测绘、未测绘或未生成。
messagelist--ch14--msg5=雷达的工作是对盲人和明眼玩家都一样：让靠近雷达的区块保持可见，较远但未超出范围的区块保持已测绘。对你来说区别在于已测绘但未可见的区块显示为模糊。多数时候我们忽略可见性问题而你也没有战争迷雾。但雷达对你有两层意义。
messagelist--ch14--msg6=第一，首次测绘区块是扫描器感知它们的途径，从而找到远程资源矿床。明眼玩家用车探索配合小雷达，但这对你不方便所以无障碍雷达经过重新平衡几乎不让任何区块可见而是大幅扩展测绘范围。
messagelist--ch14--msg7=第二，雷达 mattered 的原因是我们在远程实体配置中尊重区块可见性。你不能远程修改实体物品栏但如果可见就可以修改所有设置否则必须走过去。大部分时候可以忽略直到建起大规模设施——保持无障碍雷达运行直到显示 100% 再移到别处即可。如果想加快测绘速度多个雷达可以叠加生效多放几个就行。
messagelist--ch14--msg8=接下来回顾机械臂还有三件事要知道。
messagelist--ch14--msg9=首先不是所有机械臂每次只移动一件物品。之前说用地面搬运更慢的原因就在这里：机械臂下方有多件物品时可以一次抓起多件。例如满载传送带最多一次抓 16 件，箱子更是远超这个数；有空位时也能一次放下多件。
messagelist--ch14--msg10=两种方式获得此能力：研究机械臂堆叠加成或使用大容量机械臂。
messagelist--ch14--msg11=其次除燃烧机械臂外都有过滤器。点击机械臂打开可以锁定只处理特定物品的过滤器。不算特别有用但在共享箱子等场景非常 helpful 要知道。至少有一个后期场景必不可少我们不一一剧透。
messagelist--ch14--msg12=第三机械臂与实验室有特殊规则。实验室同时兼具箱子和合成机的特性。如果用机械臂串联多台实验室游戏会把科学包送到最远的那台然后用刚好够研究的量逐台填满。这意味着不必费劲把科学包送到所有实验室只需放到一台再用机械臂在实验室间传递扩展即可。 eventually 你需要至少 6 个科学包进所有实验室这一点很实用。
messagelist--ch14--msg13=接下来是车。手动驾驶很奇怪我们不推荐除非战斗用途但巡航控制可以替你开车。确保把车停在相对开阔处否则 KK 启动时会对你的建筑造成轻微损坏。
messagelist--ch14--msg14=车很有用因为它们像轮式箱子。可以放一堆物品然后开车到目标位置。模组提供 Shift + V 循环切换角色附近所有载具来辅助。
messagelist--ch14--msg15=最后讲填海造陆和地砖铺设。我们无法给出好教程因为很难构造合适场景。
messagelist--ch14--msg16=有些物品放置的是地砖而非实体例如石砖放置砖 path。多数是装饰性并提供更快行走速度。唯一特殊例外是填海造陆这是贵价的填湖手段。
messagelist--ch14--msg17=模组让建造和开采地砖都很简单：手持物品点击建造；扩大光标批量建造。同样可以开采地砖但有两条重要事项。
messagelist--ch14--msg18=第一必须手持对应的地砖才能打开地砖界面。
messagelist--ch14--msg19=第二有个 bug：按住 X 会多挖一点。原因复杂但开采地砖是非常稀有的操作所以现在不值得修。 workaround 是轻点 X 即可。
messagelist--ch14--msg20=还有一些与规划师的交互不是我们实现的。
messagelist--ch14--msg21=第一蓝图默认仅在未选中任何实体时才包含地砖；要始终包含请右键然后勾选对应选项。
messagelist--ch14--msg22=第二拆除规划师默认仅在未选中实体时才拆除地砖这样初次标记可以移除地表物体而不连带地板。这也可以在规划师配置中更改。注意：修改配置会让规划师变永久因此需要显式删除或保留。
messagelist--ch14--msg23=无论如何祝你好运。此后你可能偶尔需要一些帮助来理清思路但应该已经掌握操作模组所需的一切知识。
messagelist--ch14--msg24=唯一还 essential 的教程章节是关于物流和建筑机器人的，那是数十小时后的内容。后续我们可能增加其他非必要章节都会在更新日志中注明。
messagelist--ch14--meta=eJyrVkrOL80rUbIyMtFRykvMTVWyUkrOMDRRqgUAbhkHxQ==

messagelist--ch15--msg1=本章讲解物流机器人、建筑机器人及基础装备管理。这是后期内容至少 30 小时后才会触及。应在解锁模块化装甲之后再来，但等到建筑机器人和物流机器人以及若干其他科技一并解锁会更划算。大体上这是对原版难自己悟出的机制的解释同时附带一些模组特性。我们不逐一列举科技树——科技很多你会逐步解锁。以下聚焦各个组件。请注意本教程假设你在和平模式但其中许多也可配合战斗相关装备如个人护盾使用。开始吧。
messagelist--ch15--msg2=异星工厂有两个 recurring problems：建造大型蓝图和搬运物品。机器人提供替代方案。先解锁模块化装甲获得装备栏；然后是建筑机器人自动建造；紧接着是物流机器人搬运物品。初期只作用于你自己的物品栏随后解锁使用特殊箱子替代传送带的功能。
messagelist--ch15--msg3=就像你有工厂某些装甲也有装备栏。通过装备标签页暴露里面有用键说明的 tooltip。准备好后可以进入那里装备模块化装甲、便携式太阳能板、个人 roboport 和个人电池。这是建筑机器人的最低配置。再配上建筑机器人和所需物品你已经开始在角色附近自动建造幽灵了。
messagelist--ch15--msg4=装备栏中的物品有尺寸。可以通过从总览 Tab 切换到网格查看实际布局但我们建议从大到小依次装备。这样在原版中模组能高效利用装甲空间不留太多空位。
messagelist--ch15--msg5=就像外部工厂一样装甲也有电力概念。白天从便携太阳能板获取夜间存入个人电池。可以在装备总览或按 G 查看统计数据。按 G 时还会听到健康状态的 Pan 音：最右满血向左逐渐减弱。
messagelist--ch15--msg6=用原版按键 Alt + F 可切换建筑机器人仅影响你的个人机器人。我们即将讲如何在基地安装建筑机器人所以要知道不在装甲里的机器人无法被开关控制。
messagelist--ch15--msg7=接下来是 roboport。通电后这个 4×4 的建筑建立 50×50 的后勤网络（距中心 25 格如同电线杆）。两个 roboport 放得够近就连成更大的后勤网络同时建立更大 100×100 的建筑范围机器人会飞出建造。稍后详述。
messagelist--ch15--msg8=roboport 可改名 NETWORK 也可作为地标。roboport 有几项功能：一是让机器人进入网络。手持机器人 Control 左键点击它或用 UI 操作。注意取出很难因为机器人通常到处飞这不是模组限制只是游戏如此。二是给机器人充电。充满电才能飞行工作低电量时返回 roboport 找空位充电。简单说需要 roboport 的两个原因：扩展网络规模和确保机器人有足够充电站。游戏对此相当智能会尽量把机器人送到有空位的 roboport。
messagelist--ch15--msg9=不过在滥用之前注意 roboport 是最耗电的物品之一！这就是机器人的 downside。
messagelist--ch15--msg10=现在机器人进了网络但它们需要能拿到物品。这正是 passive provider 和 storage 箱子的功能。这些称为 logistic containers 与机器人交互：里面的物品会被需要的机器人取走。必须靠近 roboport 才能在网络中。
messagelist--ch15--msg11=所以如果往 storage 箱里放一堆传送带然后放置蓝图且都在有可用建筑机器人的 roboport 范围内它们就会替你建造。无论你在哪都行。如果蓝图里还有更多 roboport 机器人会建它们并扩展网络。这意味着一种玩法是永远不移动！机器人能替代大多数动作。
messagelist--ch15--msg12=和普通容器一样机械臂也能与它们交互从而自动化补给网络。但提醒一下只有你的个人建筑机器人可以开关。如果把建筑机器人放进非 personal 的 roboport 它会一直尝试建造停不下来而且速度很快。所以放错幽灵可能没等你反应过来就已经建成而非幽灵。
messagelist--ch15--msg13=接下来讲物流机器人。物流机器人是中期替代传送带的方案。但在深入前要明确 Trade-off：理论上仅靠机器人也能通关但会比你想象困难得多。问题在于机器人速度慢单次携带量极少。它们直线行走自动帮你分类但耗电量巨大甚至比最慢的传送带还慢。想一次搬 500 件物品初期就需要 500 台活跃机器人。虽有科技改善但幅度有限。
messagelist--ch15--msg14=这让它们在短距离搬运大量不同物品时非常出色。不用分拣器箱子相距几格机器人就能来回穿梭充好电。但若想把同种物品运 200 格远机器人会花极长时间中途还要反复回充。回充时它们会把物品带到 picked 的 roboport 让其他部分暂时不可用。
messagelist--ch15--msg15=那哪些场景适合？很多。例如核电厂电力不是问题可以跑几千台机器人。如果用火车装载机器人非常有用。如果有高价值低体积物品如引擎单元只需移动几格放下 roboport 和物流机器人就能省去布线。一个不那么明显的用途是建立覆盖全基地的全球网络然后用它把科学包送回实验室。
messagelist--ch15--msg16=当然你需要知道如何与它们交互。这就引出 logistics 界面和剩余箱子类型。
messagelist--ch15--msg17=首先解锁的是你个人的 logistics。这让你用机器人给自己补给。按 Control + Shift + L 访问个人 logistics 界面。包含总览 tab 和一个或多个分区 tab。
messagelist--ch15--msg18=每个分区以表格形式列出若干物流请求。点击值编辑 Backspace 清除。可设可选最小值和最大值。例如 0 到 5 表示机器人取走直到只剩最多 5 个；7 到 10 表示补货到至少 7 个。
messagelist--ch15--msg19=所有分区的请求合并计算。
messagelist--ch15--msg20=多个分区的原因在于底部的组按钮。物流组是保存的配置。当分区分配给某组后对该分区的修改会传播到世界上所有同名分区。例如建立"基础物品"组加入一系列请求把某些物品送到各处。链接后只需找一个同组分区编辑即可同步更新。可以给一个物品附加任意多组分区的请求也可以用未分组分区做实体专属请求。
messagelist--ch15--msg21=删除组用 Control + Backspace 危险删除键。对也用火车的高级玩家补充：火车组在最后一列火车离开后消失但物流组不会。物流组是"独立存在"火车组更像频道存在即在用否则不存在。
messagelist--ch15--msg22=个人 logistics 最后一个功能是个人垃圾桶。按 O 把物品投入 logistic trash inventory 机器人会来把它从你的物品栏和网络上可用的 storage 箱子中移除。
messagelist--ch15--msg23=接下来讲 requester 箱子。它与你的个人 logistics 类似但用于物品流转。同样有总览配置 tab 加若干分区全部机制相同。选中箱子后按 Control + L 访问。
messagelist--ch15--msg24=如果像普通箱子那样放置 requester  feeding 组装机然后配置请求原料组装机就会被网络喂料。再用 passive provider 箱子承接组装机产出把产物推回网络就能替代传送带。机器人从 passive provider 取物送入 requester 直到满足请求。
messagelist--ch15--msg25=特殊情况下从实体复制配置到箱子会自动设为该配方的原料请求。用单引号复制分号粘贴。
messagelist--ch15--msg26=还有两种箱子讲一下用途很 niche。
messagelist--ch15--msg27=第一种是 buffer 箱子。它是 requester 和 provider 的结合体。可以设请求把物品运进来再由机器人供应给你。与普通 provider 不同的是除非在 requester 的 tab 勾选"从 buffer 请求"否则 requester 不会从 buffer 拿东西。buffer 主要用途是给自己或建筑机器人供料。可以建立"基础补给"组（或任意名字）每放一个 buffer 就加上。这样各处始终保持库存方便自建或机器人建造时用。
messagelist--ch15--msg28=第二种是 active provider。功能同 passive provider 但强制机器人优先从此处取物即使没有其他请求。例如放入一堆木材再放 storage 箱子机器人会刻意把一切移到 storage。
messagelist--ch15--msg29=active provider 的问题和 niche 原因在于机器人会优先处理 active provider 超过一切其他请求。比如放在火车站输出端所有机器人会忙着往外搬而顾不上其他请求。
messagelist--ch15--msg30=我们 inclusion 它们主要是警告——看不见界面时容易误用 active provider 然后不知道为什么全停了。但它们确实存在因为有人有用途只是在原版中极罕见。在太空时代和其他模组中用途更多。
messagelist--ch15--msg31=本章结束——如果只记住一句话那就是"物流界面按 Control + L"。还有更多 logistics 界面没讲比如 roboport 本身上的而且系统还有很多微妙之处强烈建议查阅官方 Factorio wiki 的 logistic network 条目。
messagelist--ch15--meta=eJyrVkrOL80rUbIyNtRRykvMTVWyUkrOMDRVqgUAbf0HxA==

messagelist--ch2--msg1=既然你已经了解了整体思路，现在来谈谈你的初始目标。本章教你这些必备技能：逆向推理解决问题、使用扫描器探索世界、使用巡航控制（Kruise Kontrol）自动化移动和采矿，以及浏览物品栏。
messagelist--ch2--msg2=这是你在异星工厂中思考目标的方式。找到目标，然后从目标倒推，直到找到你现在能做的事情。
messagelist--ch2--msg3=发射火箭需要研究所有所需科技。研究在实验室中进行。实验室需要电力。电力来自蒸汽机和锅炉。蒸汽机和锅炉需要所有基础资源。
messagelist--ch2--msg4=所以首先，你需要寻找并收集资源。模组提供了一系列探索世界的手段，首先是扫描器。扫描器把地图转化为功能列表。
messagelist--ch2--msg5=扫描器最简单的用途是找岩石。岩石被开采后产出石矿，有些还含煤。
messagelist--ch2--msg6=按 End 键进行扫描。这会刷新扫描器显示的列表，并按离角色的距离排序。
messagelist--ch2--msg7=在扫描器列表中移动项目，按 Page Up 和 Page Down。
messagelist--ch2--msg8=模组提供了几种移动方式。先教你的第一种是巡航控制（KK）。
messagelist--ch2--msg9=巡航控制（Kruise Kontrol，常简称 KK）是异星工厂开发者之一的模组，用于自动化行走和采矿等简单任务。
messagelist--ch2--msg10=这里我们可以用它来自动采矿，不必逐个寻找。尝试前先读完下文，因为你无法同时阅读本教程和使用它。
messagelist--ch2--msg11=启动 KK：光标在某个项目上时，按 Control + Alt + 右方括号 ] 。我们稍后会详细讲光标，现在只需知道它由扫描器控制。
messagelist--ch2--msg12=停止 KK：在它运行时按 Enter。
messagelist--ch2--msg13=KK 运行时模组仍继续工作，但使用它会打断 KK 的动作，所以最好让它自己跑。
messagelist--ch2--msg14=现在，按 End，然后用 Page Up/Down 找一个岩石。找到后，按 Control + Alt + ] 。角色挖了几块石头后，按 Enter 停止 KK。
messagelist--ch2--msg15=你的角色现在挖到了石矿。运气好的话还会挖到煤。
messagelist--ch2--msg16=要确认是否挖到，按 E 打开物品栏。注意：E 也会关闭教程。打开物品栏后可按 Control + Alt + / 回来，再按 E 关闭。
messagelist--ch2--msg17=物品栏是一个网格，用 WASD 导航（在该模组中，WASD 相当于方向键，我们通常写成 wasd）。
messagelist--ch2--msg18=物品栏以 10×N 网格呈现，如果槽位不是 10 的倍数则最后一行截断。
messagelist--ch2--msg19=排序方式是所有物品都在开头。
messagelist--ch2--msg20=以这种方式导航不太方便，所以我们支持搜索功能。这正是你要用的。
messagelist--ch2--msg21=打开物品栏后，按 Control + F，输入 coal，然后按 Enter。这设置搜索关键词，但不会立即跳转。
messagelist--ch2--msg22=循环搜索结果：按 Shift + Enter 下一个，Control + Enter 上一个。
messagelist--ch2--msg23=这些控制逻辑有些特别。记忆技巧：Shift 在 Control 上方，所以上下对应。
messagelist--ch2--msg24=搜索结果会自动更新。现在你不需要担心这个，但一旦开始合成，就不需要反复按 Control + F 来看新物品是否出现，直接用 Shift + Enter 就行。
messagelist--ch2--msg25=如果 coal 没结果，说明还没找到。你有两个选择：多挖些石头，或者转到下一章讲的资源矿床开采。
messagelist--ch2--meta=eJyrVkrOL80rUbIyMtVRykvMTVWyUkrOMFKqBQBmnQeT

messagelist--ch3--msg1=继续深入游戏，现在是放置第一个建筑的时候了。本章教你光标系统、角色在世界中的移动方式，以及如何在一块煤矿上放置燃烧式采矿钻。
messagelist--ch3--msg2=模组有一个虚拟光标的概念，简称为光标。当所有 UI 关闭时，WASD 移动光标。
messagelist--ch3--msg3=光标是你的手在世界的延伸，相当于明眼玩家的鼠标。它可以用来检查物体和执行操作。
messagelist--ch3--msg4=角色本身（通常就叫"角色"）是你物理存在的位置。
messagelist--ch3--msg5=建造时，角色必须在光标的 10 格范围内。
messagelist--ch3--msg6=要做到这一点，你需要四处走动。有三种选项。
messagelist--ch3--msg7=最简单的是使用巡航控制（KK）。和上一章一样，你可以在空地块或资源矿床上调用 KK。如果有通路，KK 会带你过去。
messagelist--ch3--msg8=如果在资源矿床上，到达后会开始采矿。到达后按 Enter 取消即可。
messagelist--ch3--msg9=第二种方式是按 Alt + K。Alt + K 会播报光标与角色的距离。
messagelist--ch3--msg10=方向键可以移动角色，Alt + K 可以用来确认位置。
messagelist--ch3--msg11=这有两个不便之处。
messagelist--ch3--msg12=首先是需要按 I。I 控制光标是否跟随角色移动。如果光标锚定在角色上，移动角色时光标也会动，这就失去意义了。
messagelist--ch3--msg13=在新存档中，光标默认不锚定，这也是你想要的正常状态。根据用户反馈，我们可能未来会移除这个功能。
messagelist--ch3--msg14=第二个问题是方向键不会寻路。目前你可以走是因为角色能贴着树木和岩石滑动，但一旦建造了第一批建筑，就会有阻碍。
messagelist--ch3--msg15=第三种移动方式是传送。这是最简单也是作弊的方式。社区对作弊程度的看法不一：一方面传送到瞬间移动，另一方面异星工厂本质是建造游戏而非探索游戏，且你已经比明眼玩家慢了。
messagelist--ch3--msg16=传送方法：将光标移到想去的地点，按 Shift + T。
messagelist--ch3--msg17=传送唯一非作弊的用途是精确定位角色在特定格子上。我们稍后会细讲，但这种短距传送到经常发生。其中一个你可能关心的用途是：把角色移开建筑区域。
messagelist--ch3--msg18=最后，你可以随时把光标重置回角色位置，按 J 即可。
messagelist--ch3--msg19=现在来找煤矿。如果你查看了物品栏，会发现自带一把燃烧式采矿钻。是时候放置它了。
messagelist--ch3--msg20=每张地图都有一个起始区域，大约在坐标 (0, 0)。按 K 获取坐标。起始区域保证在约 100 格范围内有铁矿、铜矿、煤矿、石矿和水。
messagelist--ch3--msg21=你可以把光标移到指定坐标。按 Shift + C，输入两个用空格分隔的数字，然后按 Enter。
messagelist--ch3--msg22=顺便提一下：在异星工厂中，负 Y 方向是北方。虽然这很反直觉，但我们无法更改。
messagelist--ch3--msg23=坠毁现场也在 (0, 0) 附近。我们稍后再详谈——大体上它是装饰性的。
messagelist--ch3--msg24=现在来找煤矿。游戏后期有数千种东西，即便现在就，扫描器也非常嘈杂。
messagelist--ch3--msg25=你可以通过更改扫描器分类来处理这个问题。按 Control + Page Up 和 Control + Page Down 切换分类。
messagelist--ch3--msg26=当前有哪些分类取决于该分类下是否有内容。
messagelist--ch3--msg27=切换到资源分类，再用 Page Up/Down 找煤矿。
messagelist--ch3--msg28=此时你也想用光标探索一些，所以请注意：扫描器会记住你当前的选中项。按 Home 可以把光标移回扫描器当前选中的项目。
messagelist--ch3--msg29=找到煤矿时，光标会被移到矿脉中央。模组会说类似"coal x 1234"的话。coal 是资源名，数字是该格子剩余的储量。
messagelist--ch3--msg30=这个数字叫丰富度（richness）。矿脉中心最富饶，越往边缘越稀薄。
messagelist--ch3--msg31=扫描器也追踪矿脉的整体使用情况，让你可以远程监控剩余量。注意：已知在某些模组更新或加入已有存档后会出现偏差，因为它依赖于采矿前就能看到矿脉。
messagelist--ch3--msg32=无论如何，用巡航控制走到煤矿。
messagelist--ch3--msg33=上一章末尾说有一种不用石矿就能获得煤的方法，那就是手工开采矿脉。
messagelist--ch3--msg34=异星工厂的采矿包括获取资源、砍树以及拆解已放置的建筑。这些都使用我们要描述的按键。
messagelist--ch3--msg35=巡航控制会替你采矿，但你仍需学习手动控制。手动采矿时，把光标放在 10 格内的可采矿物上，按住 X。
messagelist--ch3--msg36=如果 X 对准的是资源，你会听到角色手工采矿的声音。大约每秒得到一块煤。
messagelist--ch3--msg37=此刻有多少煤不重要，只要有几块就行。
messagelist--ch3--msg38=现在放置第一个建筑。打开物品栏，找到采矿钻，按左方括号 [ 。
messagelist--ch3--msg39=教程从现在开始把这次点击称为"左键单击"。就像鼠标按钮一样：[ 是左键，] 是右键。我们尽量匹配明眼玩家的常用含义，尽管并非总是可行。
messagelist--ch3--msg40=单击采矿钻后，模组把它放到你手里。现在你可以在想要放置的地方点击地面来建造。
messagelist--ch3--msg41=燃烧式采矿钻是 2×2 大小，会挖掘其正下方的所有内容。所以钻头对着煤就会产煤。
messagelist--ch3--msg42=少数情况下，矿脉靠得太近导致钻头边缘同时覆盖两个矿脉。这时你能从钻头得到两种资源。但矿脉永远不会重叠——同一格不会出现两种资源。由于我们靠近矿脉中心建造，不用担心这个问题。
messagelist--ch3--msg43=你拿着钻头是以左上角（西北角）为基准。这种情况下，它会从光标位置向右延伸一格，向下延伸一格。
messagelist--ch3--msg44=按 R 改变朝向。默认朝北，但现在熟悉控制是个好时机。这里保持朝北以匹配教程。
messagelist--ch3--msg45=注意：Shift + R 逆时针旋转。
messagelist--ch3--msg46=现在对着煤点击，它会立即建成。
messagelist--ch3--msg47=拆除建筑会原样返还物品，不消耗任何成本。
messagelist--ch3--msg48=放置后，移动光标 around 一些，听钻头说什么。特别注意它会报"缺燃料"。
messagelist--ch3--msg49=和角色一样，建筑也有物品栏。这个钻头有一个燃料槽。
messagelist--ch3--msg50=我们稍后会详细讨论你的选项，但现在先讲快速传输。
messagelist--ch3--msg51=去物品栏找到煤，按左键把它拿起来。然后把光标移到钻头上。
messagelist--ch3--msg52=异星工厂的物品以堆叠形式存在。按 Shift + Q 可查看手中物品的名称和堆叠上限。
messagelist--ch3--msg53=放下物品有三个控制方式。因为放下是物理动作（不只是配置），角色必须靠近钻头。
messagelist--ch3--msg54=第一种是 Control + 左键（Control + [）。手中有机床"想要"的物品，且光标在机床上方时，Control 左键智能地把一整堆物品放入最合适的位置。
messagelist--ch3--msg55=这里就是燃料槽，物品是煤。
messagelist--ch3--msg56=如果没有整堆，会放下你有的全部。
messagelist--ch3--msg57=第二种是 Control + 右键（Control + ]），会放下半堆。
messagelist--ch3--msg58=但处理非满堆时略有不同。此时放下剩余数量的一半。
messagelist--ch3--msg59=煤的上限是 50。如果你有 200 块煤，它会放下 25。但如果只有 10 块，只会放下 5。
messagelist--ch3--msg60=最后一种方式是 Z。Z 只放下一件物品。当你只想给机器放少量东西时很有用。
messagelist--ch3--msg61=拿一些煤，用上述任一方式放入钻头。
messagelist--ch3--msg62=你会听到钻头启动一小会儿然后停下，即使你放了 50 块煤。
messagelist--ch3--msg63=如果把光标移到钻头的西北角，会听到"output chute"（输出漏斗）。钻头会把产物落到距离输出漏斗一格的地上。这里是向北一格，落了一块煤。现在移动光标找到它。
messagelist--ch3--msg64=当角色物理站在物品上方时，按住 F 可以拾取。也可以在角色够得着且光标对准它时轻按 X。
messagelist--ch3--msg65=你现在的问题是：钻头把第一块煤吐出来后无处可放。规则是地上的格子每次只能容纳一件物品。即使煤能堆叠到 50 块，每次也只出一块。
messagelist--ch3--msg66=不幸的是，何时停机的规则并不完全一致。其他重要情况以不同方式工作。
messagelist--ch3--msg67=我们能解决这个问题。下一章学合成物品时，会用箱子来解决。
messagelist--ch3--meta=eJyrVkrOL80rUbIyM9dRykvMTVWyUkrOMFaqBQBm/gea

messagelist--ch4--msg1=既然你能放置建筑了，现在是学习游戏核心系统的时候了。本章教你 UI 层级、如何查看科技、如何合成物品，以及如何在物品栏之间转移物品。你将通过合成木箱来改进你的燃烧式采矿钻。
messagelist--ch4--msg2=主菜单（E）包含多个标签页。还有世界菜单（Alt + W）和模组配置菜单（Control + Alt + Shift + M）。
messagelist--ch4--msg3=后两者暂时不重要，我们不多讨论。
messagelist--ch4--msg4=模组 UI 分为两级层次结构。
messagelist--ch4--msg5=顶级是标签页，如"物品栏"、"合成"和"研究"。用 Control + Tab 和 Control + Shift + Tab 在这些之间导航。
messagelist--ch4--msg6=下一级是子标签页或控件，用 Tab 和 Shift + Tab 导航。比如在物品栏标签页里，这就是该建筑的每个可用物品栏。
messagelist--ch4--msg7=UI 还提供帮助系统，按 Shift + / 打开。按 E 关闭帮助，回到之前的 UI。
messagelist--ch4--msg8=还有两个重要的按键。K 提供聚焦对象的详细信息（如果有），Control + WASD 可向指定方向尽可能远地移动。例如 Control + W 是菜单顶部。
messagelist--ch4--msg9=我们先讨论研究。虽然合成能修好你的钻头，但研究告诉你为什么这很重要以及目标是什么。
messagelist--ch4--msg10=打开主菜单，进入研究标签页。由三行组成，从上到下分别是：可研究的、已锁定的、已研究过的。
messagelist--ch4--msg11=用 W 和 S 切换行，A 和 D 浏览行内内容。
messagelist--ch4--msg12=我们的许多 UI 都采用这种非直观的形状，这样你就不必滚动长菜单。
messagelist--ch4--msg13=幸运的是，每个 UI 都像之前搜索物品栏一样支持搜索。
messagelist--ch4--msg14=现在你有两个可研究的科技：蒸汽动力和电子学。
messagelist--ch4--msg15=异星工厂有两种科技，一种是你可以选择的，另一种是自动解锁的。当前两个可选科技都有解锁条件而非科学包需求。按 K 查看具体内容。
messagelist--ch4--msg16=电子学的条件是"合成 10 个普通品质的铜板"，蒸汽动力的条件是"合成 50 个普通品质的铁板"。
messagelist--ch4--msg17=品质是太空时代的内容。在基础游戏中你不可能找到比普通更好的品质。
messagelist--ch4--msg18=现在我们知道了需要什么。怎么得到呢？返回一个标签页到合成标签页，搜索 plate。
messagelist--ch4--msg19=如果点击任意板类配方，游戏会提示你不能合成！因为这些必须在机器中进行。
messagelist--ch4--msg20=要查看能在哪些机器中合成某物，按 K。这会同时显示所需材料。
messagelist--ch4--msg21=你可能还想知道配方的产物有什么用。按 Y 查看它属于什么类型以及有什么属性。
messagelist--ch4--msg22=我们不能轻易筛选出你已有的机器，但可以逐个检查。你会发现这种情况下你有的是石炉。
messagelist--ch4--msg23=你开局就有一个，而石矿在这章早期之所以有用，是因为你现在可以用它做出更多。
messagelist--ch4--msg24=好了，回到修复燃烧式采矿钻。石炉需要煤才能运行。煤和矿石进去，板材出来。这在合成菜单中不明显，而且电炉不需要煤。一般而言，你可以看设备是否抱怨没燃料，或者检查它有没有燃料槽。
messagelist--ch4--msg25=如果煤没有稳定供应，就无法推进。
messagelist--ch4--msg26=我们用木箱来解决。用扫描器找一棵树，让巡航控制替你挖几棵。
messagelist--ch4--msg27=这会给你木材。几乎没有东西用到木材，所以不用担心耗尽。
messagelist--ch4--msg28=有了木材后，就可以合成木箱了。
messagelist--ch4--msg29=之前你找到了燃烧式采矿钻吐出煤的地方。回去那里（可以用扫描器找到钻头），在那个格子上放置箱子。
messagelist--ch4--msg30=如果箱子位置正确且钻头有燃料，它现在开始缓慢地向箱子填充煤炭。
messagelist--ch4--msg31=很快我们会讨论更高效的维持燃烧钻的方法。现在重要的是要知道它产出的煤多于消耗的煤。
messagelist--ch4--msg32=这意味着你可以把钻出来的煤放回钻头让它持续运行。
messagelist--ch4--msg33=你有几种从箱子取出物品的方法。
messagelist--ch4--msg34=第一种和第二种是 Control 左键/右键，就像做智能插入，但这次用手为空的状态。此时游戏会智能地取走物品。对于箱子来说就是"取出全部内容"。
messagelist--ch4--msg35=你可以通过按 Q 清空手部。Q 在手为空时有第二功能，我们稍后讨论。如果提示放到了你手里，再按一次 Q。
messagelist--ch4--msg36=第三种是打开箱子本身的物品栏。你可以点击物品把手中拿到，然后按 Q 把物品放入你的物品栏。或者 Shift + 左键 一次性移动一整格，Shift + 右键 移动半格。
messagelist--ch4--msg37=我们称之为同级物品栏，反向同样适用。如果你探索箱子的可用标签页，会看到另一个是你的物品栏。Shift 点击控件在你的物品栏中也能把物品移到箱子。
messagelist--ch4--msg38=你现在的责任是留意这套装置。偶尔钻头需要更多燃料。当它用完时需要从箱子取煤放入钻头。很快我们会有不依赖定期检查的解决方案。
messagelist--ch4--msg39=在结束本章之前，你应该知道你现在正在产生污染。本教程对此着墨不多，因为你本该在和平模式下，但它即使在和平模式中也 matters。
messagelist--ch4--msg40=随着游戏推进，你的工厂会产生污染。具体数量取决于你建造的机器数量和当时运行的机器数。仅这一个钻头产生的污染非常少且缓慢，但随着你建造更多，产出速度越来越快。
messagelist--ch4--msg41=敌人生成器会根据污染变强。如果你不在和平模式，它们最终会来攻击你。
messagelist--ch4--msg42=污染像云一样从机器处真实扩散。按 Shift + U 可查看光标处的污染量。
messagelist--ch4--msg43=下一章我们会讲更快的移动方式，然后进入冶炼以解锁那些科技。
messagelist--ch4--meta=eJyrVkrOL80rUbIyMdZRykvMTVWyUkrOMFGqBQBmpQeV

messagelist--ch5--msg1=既然你有了要管理的建筑，需要高效的导航方式在它们之间移动。本章教你三种光标导航方式：书签（一个快捷参考点）、快速旅行点（多个命名位置），以及光标跳过（快速探索大片区域）。
messagelist--ch5--msg2=第一种也是最简单的是书签。按 Shift + B 设置书签，按 B 把光标移回它所在位置。比如把光标放在箱子上然后按 Shift + B。
messagelist--ch5--msg3=你只有一个书签位，所以第二种选择是快速旅行菜单。按 Alt + V 打开，可以创建命名的快速旅行点。
messagelist--ch5--msg4=每行对应一个点，每行有一系列命令。先在煤矿装置处把光标放好，点击"创建新点"，输入名称，然后按 Enter。
messagelist--ch5--msg5=接着探索菜单看看还有什么可用功能。
messagelist--ch5--msg6=最重要的两个功能是传送和移动光标，这是你监控钻头的方式。任选其一，需要回来时用巡航控制即可。
messagelist--ch5--msg7=现在要了解的第三个功能是光标跳过。
messagelist--ch5--msg8=按住 Shift 再用 WASD 移动，光标会在给定方向上最多移动 100 格，停在第一个变化处。
messagelist--ch5--msg9=具体什么算"变化"因情况而异，但通常符合预期。
messagelist--ch5--msg10=这里用光标跳过在你的煤矿上来了解它有多大、是什么形状，会很明显。
messagelist--ch5--msg11=你可能会发现它比想象中大得多。别担心， drills 很快就会覆盖这个问题。
messagelist--ch5--meta=eJyrVkrOL80rUbIyNNRRykvMTVWyUkrOMFWqBQBmWgeR

messagelist--ch6--msg1=现在是建立基础冶炼并不再忽视坠毁现场的时候了。
messagelist--ch6--msg2=为了不用再来回跑，我们需要第二台采矿钻。但采矿钻需要板材来合成，也需要石炉。再继续之前，先查看燃烧式采矿钻的配方，确认所需材料。
messagelist--ch6--msg3=铁齿轮也是配方，消耗 2 块铁板。算一下的话，你需要 9 块铁板和 5 个石炉。
messagelist--ch6--msg4=幸运的是，合成本身很智能。如果你材料足够却尝试合成钻头，游戏会自动帮你合成小件物品。
messagelist--ch6--msg5=不幸的是模组没那么智能。我们会尽量告诉你缺少什么，但这种情况下可能会说是缺少炉子。所以你看到的可合成数量总是正确的，但当数字为 0 时就需要自己判断原因了。
messagelist--ch6--msg6=现在我们需要 9 块铁板，其中 8 块在坠毁现场里。坠毁现场的所有建筑都可以开采，只是需要长按 X 一段时间。异星工厂中有些东西挖起来比其他慢。
messagelist--ch6--msg7=坠毁现场中包含物品的建筑同时也是容器。它们在扫描器中被识别为容器类型，支持我们之前教过的容器控件。
messagelist--ch6--msg8=选一种你喜欢的方式来从坠毁现场获取板材。
messagelist--ch6--msg9=第 9 块板必须来自我们的炉子。用扫描器找一个铁矿矿床，然后走过去。接下来像挖煤一样手工开采，直到至少有 1 块铁矿石。
messagelist--ch6--msg10=拿到后，选一个放置炉子的位置。通常在铁矿矿床中间，因为钻头可以直接输出到它上面。
messagelist--ch6--msg11=然后用你习惯的控制方式放入一些煤和一些铁矿石。
messagelist--ch6--msg12=模组在合成机器完成工作时播放轻柔的提示音。你把光标移到炉子上也能看到产出。
messagelist--ch6--msg13=这个音效和缩放绑定。用减号和等号调整缩放——它控制你一次性听到的工厂范围大小，也从明眼玩家的视角设定屏幕显示内容。
messagelist--ch6--msg14=采矿钻是异星工厂中唯一直接向地面输出物品的实体。炉子有输出物品栏，装满 100 块板后才停止。
messagelist--ch6--msg15=你可以用之前学过的任何方法取出物品。
messagelist--ch6--msg16=由于这是第一台有多个物品栏的机器，你可以在它的 UI 打开时按 Tab 检查各物品栏。要打开机器 UI，单击它。
messagelist--ch6--msg17=模组尽量允许你在手中有物品时也打开菜单，但有时可能需要先清空手部，尤其是手中物品是建筑时。
messagelist--ch6--msg18=无论是从坠毁现场挖矿还是直接冶炼 9 块板，完成后都能合成第二台燃烧式采矿钻。
messagelist--ch6--msg19=现在你面临一个选择。燃烧式采矿钻有两种用法，机制相同。如果把一台燃烧式采矿钻放置在会让产物落入另一建筑的位置，它就会把产物放到那个建筑里。
messagelist--ch6--msg20=例如，把它放在炉子南边朝北放置，钻头的西北角就在炉子正下方，和你之前用的箱子位置相同。
messagelist--ch6--msg21=第一个选择是把钻头对准炉子，给它加燃料。这会自动化冶炼过程，只要钻头和炉子都有煤，你的任务就是确保这三样地方都有燃料。
messagelist--ch6--msg22=第二个选择稍微复杂一点，但同样容易设置。你也可以把第二台钻头朝向第一台放在煤矿上的钻头，这样你就能持续备煤。
messagelist--ch6--msg23=记得钻头产出的煤多于自身消耗。如果给后面的钻头加油，它可以供给前面的钻头。给后面那台填满煤，够几千次使用。
messagelist--ch6--msg24=你也可以让两台钻头互相对着放，这样它们就能互相供煤永久运行，你可以随时取用多余的煤。用任意快速传输控件可以从一台钻头上取出所有燃料。只要不同时从两台都取，系统就会一直运转。但与箱子不同，它会很快停下来等你取走产物。
messagelist--ch6--msg25=后续我们会讲更有趣的设置。在正常流程中，上面的设置足以让你走到能合成更复杂物品的阶段，而那些才是开启更多有趣选项的关键。
messagelist--ch6--msg26=现在你的目标是获得总共 4 台钻头和一个第二台炉子。
messagelist--ch6--msg27=有了之后，用两台钻头建立一个自维持煤矿，然后用钻头+炉子组合分别处理铁矿和铜矿。给所有设备加燃料，让它运行。
messagelist--ch6--msg28=本章的目标是完成电子学和蒸汽动力研究。如果你先做铁矿且是第一次玩，大概在你设置完成时就差不多完成了。
messagelist--ch6--msg29=在冶炼装置旁设置快速旅行点是个好主意。你用手或其他方式合成的任何东西都会用到板材。
messagelist--ch6--msg30=也是时候讲讲扫描器子分类了。你可能注意到扫描器会说"burner mining drill 1 of 2"之类的内容。
messagelist--ch6--msg31=这是因为我们把东西分到更细一层。当你放置相似的建筑，或者你有多个铁矿矿床时，我们把它归入子分类。用 Shift + Page Up/Down 在这些实例之间导航。
messagelist--ch6--msg32=如果现在觉得这效率不高，稍后你会明白为什么。这是我们实现数百座建筑组织能力的关键。
messagelist--ch6--msg33=有些东西——比如森林——甚至会因为距离接近而分成多个条目。
messagelist--ch6--msg34=这样做突然变得重要的原因是：炉子在分类系统中。具体来说，所有未工作的炉子属于同一分类。由于炉子根据放入的物品改变制作内容，无法在没有工作配方时区分它们。
messagelist--ch6--msg35=最后，你可能想知道距离完成还有多远。把一块板拿在手上然后按 U，模组能告诉你已生产了多少。这在合成菜单的任何配方上也适用。
messagelist--ch6--msg36=继续之前，你应该独立完成电子学和蒸汽动力的解锁。如果提前完成还有时间，可以继续往后读。
messagelist--ch6--meta=eJyrVkrOL80rUbIyNtNRykvMTVWyUkrOMFOqBQBmyAeZ

messagelist--ch7--msg1=是时候建立蒸汽动力和实验室研究了。
messagelist--ch7--msg2=在本教程继续之前，运用你的知识合成以下物品：蒸汽机、锅炉、离岸水泵、实验室、管道到地面的接口（pipe to ground）、4-5 根普通管道，以及至少一根电线杆。
messagelist--ch7--msg3=你也可以合成传送带和机械臂，但我们不在此教授，因为你需要一大堆才能发挥作用。下次重开时，这就是开始自动化的时机。
messagelist--ch7--msg4=到这里你应该已经能独立完成，不需要我们过多指导。唯一的新知识是：电线杆配方每次产出 2 根，这意味着如果你算一下会发现每次消耗 0.5 根木材。
messagelist--ch7--msg5=在这种情况下，永远无法只合成一个，每次至少得到 2 根。
messagelist--ch7--msg6=一旦合成了实验室，自动化科学包科技会自动完成，你现在进入第一批传统科技，触及异星工厂的核心循环。
messagelist--ch7--msg7=趁此机会检查几件事。本教程会逐一说明，因为它们是你找到下一步该做什么的通用方法。
messagelist--ch7--msg8=首先找到科技"物流科学包"（logistic science pack）。要确定目标，始终瞄准下一个科学包，至少在能研究火箭 silo 之前如此。
messagelist--ch7--msg9=按 K 查看，你会发现它需要 75 个自动化科学包。
messagelist--ch7--msg10=接着找自动化科学包配方。注意它需要 5 秒加成时间（在原料时间之外）。那些原料本身也有时间成本。
messagelist--ch7--msg11=如果用手合成，会花很长时间。后续科技需要同时多个科学包，数量从几百到几千不等。到目前为止，异星工厂可能感觉像个奇怪的生存游戏。但现在你进入了游戏核心，核心就是如何扩展产能来满足实验室需求。
messagelist--ch7--msg12=到游戏后期，即使明眼玩家也不需要亲自走动建造——机器人会替他们完成。
messagelist--ch7--msg13=有时下一个科学包会被前置条件锁定。这种情况在已锁定科技行中查找。
messagelist--ch7--msg14=由于科技数量庞大，我们提供一个轻微剧透：你要解锁的是物流科学包。从这里可以继续解锁化学和军事科学包。之后再是生产和效用科学包。全部解锁后可以研究 silo 获胜。
messagelist--ch7--msg15=现在真正关心的研究是"自动化"（automation），它能让你获得组装机。组装机替你合成。喂入原料后，它能合成你能做的任何物品。你解锁的这个版本比你慢，但可以同时运行尽可能多的机器。
messagelist--ch7--msg16=本教程一直在给你物品属性信息，现在告诉你如何自己获取这些信息。
messagelist--ch7--msg17=K 也在物品栏中有效，提供更多详情。在地图上也可用，但地图版详细程度低很多。
messagelist--ch7--msg18=Y 在合成菜单中会告诉你某配方所有产物有什么用。在地图上则读出手中物品的全部属性。
messagelist--ch7--msg19=本章附有示例蓝图。我们要讲的比较复杂，所以提供了可查看的参照物。
messagelist--ch7--msg20=提醒一下：按 Tab 可以查看示例蓝图。
messagelist--ch7--msg21=蓝图像建筑，但一次放置多个结构，放置的是"幽灵"而非真实建筑。如果你有对应物品，对幽灵调用巡航控制，KK 会找到所有可建造的幽灵替你把蓝图建出来。
messagelist--ch7--msg22=借此你可以与他人共享结构。
messagelist--ch7--msg23=和建筑一样，你是从布局的西北角开始建造的。
messagelist--ch7--msg24=本章的两个示例蓝图是我们即将描述的锅炉组装，以及一个有效的 pipe to ground 配对示例。
messagelist--ch7--msg25=这些蓝图是永久性物品，清空手部后会进入你的物品栏。也可以用 Control + Backspace 销毁，在地图上手持时使用或在物品栏中选择时使用。
messagelist--ch7--msg26=Control + Backspace 是危险删除，用于销毁不可恢复的对象。这适用于各种含有数据类型的物品。
messagelist--ch7--msg27=回答一个常见问题：你不能用这种方式销毁普通物理物品。销毁普通物品的唯一方法是放入箱子然后射击该箱子。
messagelist--ch7--msg28=现在第一件事是找水。在扫描器的资源分类中。光标会定位在水面离角色最近的格子上。把角色移到那里。注意角色不能游泳，需要站在陆地上。
messagelist--ch7--msg29=本教程将从南向北解释布局。我们要建的设施宽 3 格、高 11 格。你要用光标跳过确认有足够的空间，并靠近水边。
messagelist--ch7--msg30=最南端的建筑是一个朝北的锅炉。这是一个 3×2 的建筑，将水转化为蒸汽。
messagelist--ch7--msg31=放置后，探索它会发现边缘有三个连接点。西南角和东南角是两个进水口，北侧中央是蒸汽出口。模组会告诉你每个连接点的朝向。此处西南连接口朝西，东南连接口朝东。
messagelist--ch7--msg32=连接使用流体的实体时，在连接点朝向的方向旁边放置管道或另一个实体即可。例如，把管道放在锅炉西南角的西侧。偏西方向很重要。
messagelist--ch7--msg33=还要注意模组不会说这些进水口是输入端。约定俗成的是：当流体可以双向流动时模组不说。你可以把多台锅炉连成一排，给第一台供水，整排都会接到水。
messagelist--ch7--msg34=接着放置蒸汽机。它是 3 格宽、5 格高。从锅炉的西北角向上数 5 格。
messagelist--ch7--msg35=探索蒸汽机会发现顶部中心和底部中心各有一个双向蒸汽连接口。如果放对了位置，朝南的蒸汽口正好在锅炉朝北出口的一格北边，整个布局变成 3 宽 × 7 高。
messagelist--ch7--msg36=一会儿我们会给锅炉加水加燃料，蒸汽机会因此充满蒸汽。扩展电力时可以把多台蒸汽机叠在一起，它们相互供电。
messagelist--ch7--msg37=第三，在蒸汽机的西北角北边一格，放置一根小型电线杆。
messagelist--ch7--msg38=电线杆负责输送电力。游戏自动处理电线，可以把它理解为无线电力发射器。
messagelist--ch7--msg39=电线杆有两个参数：供应范围和电线延伸长度。暂时不用管电线延伸长度，下一章再说。
messagelist--ch7--msg40=小型电线杆的供应范围是以电线杆为中心的 5×5 方框。如果相邻建筑的任意部分在这个范围内，就与该电线杆连接。电线杆的供应范围都以这种方式呈现，大多数"方框型"范围也是如此。
messagelist--ch7--msg41=现在电线杆正在从蒸汽机取电，因为蒸汽机在范围内。它与蒸汽机的相对位置不重要，只要距离够近就行。
messagelist--ch7--msg42=接着从电线杆再向北数 3 格放置实验室，使整个布局变为 3 格宽 × 11 格高。
messagelist--ch7--msg43=现在需要给水路供水。
messagelist--ch7--msg44=离岸水泵从水域格子抽水，但放置规则比较复杂。大多数玩家在整个游戏中只会放置一两个，所以我们提供辅助菜单。
messagelist--ch7--msg45=离岸水泵的规则是：它宽 3 格、高 2 格。最前端三格必须全部在水面上，后方中间的格子必须在陆地上。然后水从后方中心流出。
messagelist--ch7--msg46=进入辅助菜单的方法是：把角色移到水边，手持离岸水泵，按 Alt + 左键。这会列出所有候选位置。选择一个，泵就会建造。然后用扫描器找到它。
messagelist--ch7--msg47=管道有点特殊。异星工厂将流体建模为瞬间传送。如果管道里有水且另一端有需要水的对象，那么即使管道很长，另一端的对象也会得到水。
messagelist--ch7--msg48=异星工厂限制在约 300 格，并把建筑也算入长度。后期你可能会看到"管道过长"的报错。遇到这种情况就要缩短或改用后期解锁的水泵。
messagelist--ch7--msg49=小心区分：离岸水泵和普通水泵是不同的。
messagelist--ch7--msg50=异星工厂也不允许在同一管道中混合两种流体。现在这不重要，但后面会很关键。
messagelist--ch7--msg51=管道的放置规则是自动连接到所有可连接的邻居。例如，在一个 3×3 区域内放置 9 根管道会得到一个 3×3 的连通管网。在这里，把管道放到锅炉的进水口旁边就连接到锅炉；放到离岸水泵出水口旁边就连到水泵；画一条管道线连接到锅炉就完成了供水。
messagelist--ch7--msg52=你可以通过观察来判断管道是否正常工作：离岸水泵、所有管道段和锅炉都会说里面有水。每段管道最多容纳 100 单位水，准备好供给需要的设备。
messagelist--ch7--msg53=不幸的是你不能穿过管道。这就是 pipe to ground 的功能。
messagelist--ch7--msg54=pipe to ground 更复杂些。它只能连接到"前方"的管道——也就是说，如果朝北放置，必须南边有管道才能连接。朝向方向是地下管道的地面露出部分。
messagelist--ch7--msg55=如果两个 pipe to ground 放在同一直线上且距离够近，它们会在地下连通。规则是最多相隔 9 格。例如可以在 (5, 0) 朝西放一个，然后在 (10, 0) 朝东放第二个，它们就联通了。
messagelist--ch7--msg56=如果在 (7, 0) 朝东放第三个，它会连到 (5, 0) 而不是 (10, 0)。
messagelist--ch7--msg57=你可以把它想象成埋在地下花园里的水管，两端是你放置的部件，指向你应该对着的方向。
messagelist--ch7--msg58=pipe to ground 的另一个功能是让管道近距离并行而不混合流体。遗憾的是实用例子要等到数小时后才会遇到。
messagelist--ch7--msg59=无论哪种情况，你当下的目标是手工合成 10 个自动化科学包，给锅炉加水加煤，把科学包放进实验室，然后在研究标签页点击自动化。
messagelist--ch7--msg60=研究是排队进行的，点击会把任务添加到队列末尾。由于没有其他任务在跑，它会排在第一位。用 T 查看研究进度；如果想取消，通过 Tab 进入研究队列，点击要取消的任务。
messagelist--ch7--msg61=也可以用 Control + Shift + 左键 插入队列首位。
messagelist--ch7--msg62=一切正常的话，你的蒸汽机、实验室和锅炉都会发出声音。所有异星工厂建筑工作时都有声音，突然安静通常是出问题的信号。
messagelist--ch7--msg63=自动化科学完成后，你就可以用组装机来自动化合成了。而在机器与实验室之间自动传输物品，下一步要讲的是传送带和机械臂。
messagelist--ch7--meta=eJyrVkrOL80rUbIyM9ZRykvMTVWyUkrOMFeqBQBmzgea

messagelist--ch8--msg1=现在来讲传送带和机械臂。同时还会介绍快捷栏和取样器工具，它们可以减少频繁打开物品栏的需求。
messagelist--ch8--msg2=本章没有多少"现在就去做"的内容。你需要消化本章和下一章的知识才能回到真正的建造工作。
messagelist--ch8--msg3=我们将来会再回头看传送带的更复杂用法，也会对机械臂做简短回顾以补充更多功能。
messagelist--ch8--msg4=由于内容很多，最后要搭建的是可扩展的煤矿方案之一。这是第一个重复模式——在自身副本旁边建造时能放大规模的模块。
messagelist--ch8--msg5=机械臂最容易理解。它是一种机器人手臂，来回摆动抓取物品放到指定位置。
messagelist--ch8--msg6=异星工厂实际上模拟了手臂的物理动作。因此"x 件/秒"这类数字不如你预期的有意义。可能此刻物品不够多。当然从箱子到传送带的吞吐量与从箱子到箱子的不同，因为它们在地图上的形状略有差异。
messagelist--ch8--msg7=为了向你报告，我们告诉你大约每秒摆动次数。一个机械臂朝它要去取物的方向放置，抓起物品，摆动半个圆，放下物品，然后返回起点。
messagelist--ch8--msg8=例如，每秒 1 次的机械臂每秒完成一整圈摆动。
messagelist--ch8--msg9=机械臂不忙时会停在起始位置待机。
messagelist--ch8--msg10=除了播报数据，光标压在机械臂上时我们还会播放声音。高频咔嗒声是到达起点，低频咔嗒声是到达终点放下物品。你可以借此感受速度以及某台机械臂是否一直在忙碌。我们不一直播放这些声音是因为机械臂数量太多不现实。
messagelist--ch8--msg11=机械臂总是从正前方一格拾取，总是向正后方一格投放。如果前面没有建筑，就从地面拾取；后面没有建筑就落到地面。
messagelist--ch8--msg12=和钻头一样，每格只能放一件物品的规则在这里也适用，所以用地面搬运物品非常慢。后面你会明白原因。
messagelist--ch8--msg13=决定捡什么时，它会看将要投放的目标建筑需要什么。例如箱子接收一切，但合成机器只需要当前配方的原料。只要前方有这些东西就会 pickup。
messagelist--ch8--msg14=决定投到哪里时，它使用与 Control 左键相同的逻辑，智能选择目标中的最佳物品栏。
messagelist--ch8--msg15=你现在有两种机械臂：燃烧式机械臂和普通机械臂。区别是普通机械臂用电，燃烧式用燃料。
messagelist--ch8--msg16=燃烧式是你需要先用的一种，因为它不需要电力，消耗燃料即可。这与你在其他需要燃料的建筑上遇到的机制完全相同。
messagelist--ch8--msg17=燃烧式机械臂有点聪明。当它需要燃料且恰好正在运送燃料时，它会自己抽一部分用作燃料。
messagelist--ch8--msg18=这意味着运送铁的燃烧机械臂需要定期加燃料，但运送煤的可以自己消耗少量煤炭持续运行。
messagelist--ch8--msg19=目前你能获取的唯一其他燃料是木材。
messagelist--ch8--msg20=如果想练习，可以造两个箱子和一台燃烧机械臂。把机械臂放在两箱之间朝向其中一个，在前面箱子中放入一堆煤。煤会流向后面的箱子，扣除机械臂自用的一小部分。附带的示例蓝图不含煤。
messagelist--ch8--msg21=普通机械臂需要电力。工作方式相同，但必须在电线杆供电范围内。我们暂不使用它，因为在你仍需四处跑动添加燃料时给一堆设备接电并不实际。否则你会一直被燃料拖累，没时间去建其他东西。
messagelist--ch8--msg22=现在转回传送带。传送带是 conveyor belt。为可玩性考虑，它们不需要电力运作。每段传送带占一格。传送带朝放置时的方向移动物品。例如朝北的传送带把物品向北运。
messagelist--ch8--msg23=每段传送带分成两条 Lane（车道）。就像高速公路上的车，Lane 方向相同，物品不会换道。游戏不会阻止物品混合之类的事情发生。后续我们会回到 Lane 话题，但现在可以先忽略。
messagelist--ch8--msg24=换个说法：每个格子内相当于并排两条小传送带，方向与你放置的大传送带一致。
messagelist--ch8--msg25=要形成拐角，先放几段直带，然后把最末一段转向新方向。放对的话，模组会把末段报为拐角。没有特定形状要求。引擎只看朝向判断"这是一个正确的拐角放置"然后自动成型。
messagelist--ch8--msg26=放错可能会产生侧载（sideload，后面讨论）或 unit（表示传送带完全反向）。
messagelist--ch8--msg27=简单来说：先放一段朝北的传送带。向北移一格再放一段朝东的。这样就形成了一个拐角，模组会告诉你位置。
messagelist--ch8--msg28=每段传送带容纳 8 件物品，每条 Lane 4 件，每分钟移动固定数量。当前基础传送带每秒 15 件，即每分钟 900 件。
messagelist--ch8--msg29=了解这些数字并用 U 跟踪物流，是很好的判断工厂是否正常的方法。例如如果你只有一条铁板传送带且产量达到 900 件/分钟，再多建炉子也无济于事——必须先解决传送带瓶颈。
messagelist--ch8--msg30=右键点击地图上的传送带可获得更详细的信息描述。这适用于大多数东西，提供你不常需的信息，因为它们不重要或者你迟早会记住。
messagelist--ch8--msg31=本章的核心技巧是：钻头产出的煤远超自身消耗。我们可以用一条传送带从钻头拉到你想去的地方，同时用一个燃烧机械臂再把部分煤拉回来。这也是附带的示例蓝图。看图比解释容易得多。
messagelist--ch8--msg32=建造方法是：搭建一个 2×4 的结构，下半部分是朝北的燃烧式采矿钻。
messagelist--ch8--msg33=然后在钻头出口处放一段朝北的传送带单元，顶部横向放两段朝东的传送带单元。
messagelist--ch8--msg34=这个结构中有一格是空的，正好适合放机械臂。在此处放置一台朝北的机械臂会从传送带上抓取煤放回钻头。
messagelist--ch8--msg35=之后可以从这里延伸传送带到任何你想要煤的地方。
messagelist--ch8--msg36=如果放置正确，煤会从东北角向东流出。别忘了所有东西都可以旋转，包括蓝图。无论是自建还是旋转本章的示例蓝图，你也可以让煤从西南角向西流出，甚至从西北角向北流出。这取决于第一台钻头的朝向。
messagelist--ch8--msg37=虽然与本章无直接关系，但要强调你必须手动投入第一块煤来启动钻头。
messagelist--ch8--msg38=把物品放到传送带上的规则很简单：要么有机械臂投到它上面，要么它位于钻头的输出格。
messagelist--ch8--msg39=从传送带上取物品的规则更简单：始终用机械臂取走，无一例外。物品不会从末端自然流下。相反，满负载的传送带会在目标位置有空位前停止移动。
messagelist--ch8--msg40=除钻头外没有其他机器直接向地面输出物品。所有其他机器也必须用机械臂传输物品。
messagelist--ch8--msg41=如果想手动从传送带取物，传送到传送带上按住 F。模组尽力汇报你拿起的物品，但在传送带物品不多时很不准确。
messagelist--ch8--msg42=最后是快捷栏和取样器工具。数字 1-0 是标准的游戏风格快捷栏，可以分配物品。
messagelist--ch8--msg43=分配方法：把手中物品放进手，按 Control + 对应数字。
messagelist--ch8--msg44=之后按该数字就能把手中物品唤出（只要背包里有）。清空槽位的方法是把手中空状态分配到该槽。
messagelist--ch8--msg45=10 个槽位太少。因此你实际上有 10 组快捷栏。用 Shift + 1-0 切换当前激活的快捷栏。要分配到更多快捷栏，先切换到那组，再按上述方式分配。快捷栏不会在你未操作时自行变更。
messagelist--ch8--msg46=一个好的做法是按类别分设快捷栏。例如第 1 组全放传送带，第 2 组全放机械臂，第 3 组放电力设施等。
messagelist--ch8--msg47=取样器工具场景性很强，但在适用时极有价值。按 Q 调用。在手满时 Q 清空手部，手空时则启用取样器。
messagelist--ch8--msg48=类似于之前做的智能插入，但反过来。对建筑使用取样器会把同种建筑放入手中。对水面使用会获得离岸水泵。对资源使用会获得采矿钻。试试就能了解它的功能。
messagelist--ch8--msg49=取样器有价值的原因之一是：有时你要长时间处理某些建筑，几个小时内都不会再碰它们。一个例子是储存罐（如果限制在你已解锁的物品内）。后面还有很多种类。
messagelist--ch8--msg50=这种情况下用取样器通常比设置整组快捷栏更方便。
messagelist--ch8--msg51=它也作用于幽灵，能把建造幽灵所需的物品放到你手上。用取样器对着幽灵会得到建造它所需的一切。移到左上角放置时会覆盖幽灵并复制设置。
messagelist--ch8--msg52=取样器的最后一个优势是与地面上的物品朝向匹配。你可能很快注意到快捷栏的手柄总是朝北，大概率会让你烦躁。对朝南的传送带使用取样器会得到同样朝向的同种传送带，而非仅仅朝北的传送带。
messagelist--ch8--msg53=接下来我们要讲如何构建长直线排列的建筑。如果你想的话，现在已经足够自动化供电了。但这需要手工放置数百段传送带，一段一段来。下一章会讲替代方案。
messagelist--ch8--msg54=如果你想在看书时有事可做，现在就可以开始合成就传送带了。一百来个起步。注意传送带配方也像电线杆，每次产出 2 条。
messagelist--ch8--msg55=既然现在开始大量合成，留意一下：Shift + 左键 一次合成 5 个，Control + Shift + 左键 则尽可能多地合成。
messagelist--ch8--meta=eJyrVkrOL80rUbIyNdVRykvMTVWyUkrOsFCqBQBm3wec

messagelist--ch9--msg1=在掌握传送带和机械臂的基础后，现在学习如何构建长直线。本章教你三个工具：Build Lock（边移动边建造）、音频标尺（精确定位和测量），以及剪贴板蓝图（快速复制粘贴结构）。
messagelist--ch9--msg2=Build Lock 最重要。开启后，角色每移动一步都会在其身后自动建造。
messagelist--ch9--msg3=光标的移动也会尝试在光标背后一格建造（比如按一次键在当前格建造再移动），但由于游戏 API 限制这不太好用，最好避免。
messagelist--ch9--msg4=行走一般没什么优势，但有一个例外：沿着已经清理完障碍物的路线行走。
messagelist--ch9--msg5=如果你知道要铺设 200 段传送带成一条直线，可以开启 Build Lock，用方向键跑出这条线，然后修整两端。两端通常会比你想要的略长几格。
messagelist--ch9--msg6=使用 Build Lock：按 Control + B 切换开关。当手部为空、再次按 Control + B，或被障碍物意外推开时会自动关闭。
messagelist--ch9--msg7=多数情况下 Build Lock 等同于手工沿线路放置。但有两个重要情况不同，因为我们提供了更便捷的行为。
messagelist--ch9--msg8=第一种是传送带。开启时传送带会跟随你的角色移动并按角色的转向自动转弯。你往哪个方向跑，传送带就跟到哪。通常不建议用来拐弯，但如果这次不需要精确也可以。
messagelist--ch9--msg9=第二种是电线杆。我们在最大连接距离处放置电线杆，连接到链上最后一根。所以小型电线杆第一次立即放置，之后每隔 7 格放置一根。
messagelist--ch9--msg10=上一章末尾我们设置了自维持煤矿，但蒸汽机和锅炉通常在离水近的地方，所以很远。现在有工具可以方便地建立连线了。
messagelist--ch9--msg11=规划好长线位置，开启 Build Lock 跑过去，然后调整两端到正确位置。如果用传送带版本的可持续煤矿，输入端需要在传送带上，输出端要在距离锅炉一格以内以便机械臂能够到。
messagelist--ch9--msg12=如果放置正确，现在就有了一个跑到钻头耗尽煤为止的供电装置。这让机械臂和电动采矿钻得以使用。稍后会细讲电动采矿钻。
messagelist--ch9--msg13=你可能在意精度。有两个辅助工具，一个来自原版，一个来自模组。
messagelist--ch9--msg14=模组提供音频标尺。按 Control + Alt + B 放置，Alt + Shift + B 清除。
messagelist--ch9--msg15=当光标与音频标尺对齐时你会听到蜂鸣。两个低频音表示距线条一格以内，高频音表示完美对齐。实际定位点发出的是咔嗒声。
messagelist--ch9--msg16=建议花点时间放置一个音频标尺并四处走动，感受它的投影形状。它形成一个十字交叉延伸至无限远。
messagelist--ch9--msg17=音频标尺与光标跳过配合使用。光标跳过时会在碰到音频标尺时停下，而不是越过它。
messagelist--ch9--msg18=也与角色配合。角色穿过标尺也会触发蜂鸣。
messagelist--ch9--msg19=它不会关闭 Build Lock。我们无法知道你放标尺是不是为了关掉它，所以碰到后你自己负责停步。
messagelist--ch9--msg20=具体例子：在锅炉处放置音频标尺，用光标跳过查看距离，然后跑传送带直到碰到标尺再转向锅炉。
messagelist--ch9--msg21=原版提供剪贴板，我们通过接口与之交互。你已经用过蓝图。剪贴板类似，但它生成的蓝图在按 Q 后自动销毁。
messagelist--ch9--msg22=使用方法：按 Control + C 进入复制模式，然后点击两个点。模组会把框内的所有内容转为蓝图。和其他蓝图一样，它可以旋转。
messagelist--ch9--msg23=要保留一份拷贝，可以打开物品栏点击空格。小心：原版和模组都会在用手部物品交换时保留蓝图。
messagelist--ch9--msg24=剪切同理，但增加了一个新状态：标记拆解。被标记为拆解的建筑会被后期解锁的自动化工具拆除，也可以由 KK 拆除并在其上放置新蓝图。
messagelist--ch9--msg25=剪切会标记框内所有对象进行拆除，然后给你生成包含被拆内容的蓝图。
messagelist--ch9--msg26=可以用剪切来整体平移大型装置几格——只需放置蓝图并调用 KK。
messagelist--ch9--msg27=像传统剪贴板一样，按 Control + V 可以恢复剪贴板内容。
messagelist--ch9--msg28=有个边缘情况要注意：明眼玩家从建筑的中央而非西北角开始构建。因此模组必须根据蓝图内的内容计算尺寸。如果在蓝图中只放一个实体却选了 1000×1000 的区域，最终只有这一个实体。如果是箱子，蓝图就是 1×1！
messagelist--ch9--msg29=也可能某个角落没有实体。举例：四个角各放一个箱子，删掉西北角的箱子然后蓝图化。结果蓝图仍是 4×4，放置时光标恰好在空缺处！
messagelist--ch9--msg30=这些点非常重要。如果需要强制蓝图固定大小，可以在四个角放廉价木箱辅助。
messagelist--ch9--msg31=下面展示如何用这个工具铺线：
messagelist--ch9--msg32=放置 5 段传送带，假设朝东。按 Control + C，点击第一段传送带，按 Shift + D 跳到东端再点击。此时手里得到 5 段传送带的蓝图。
messagelist--ch9--msg33=现在可以把蓝图放在传送带末端外一格的位置，光标跳过穿过幽灵，继续放置，反复多次。每次延长 5 格。
messagelist--ch9--msg34=蓝图可以不建幽灵直接用，你可以做出 20 段的长线再整体复制，一次放 20 段。
messagelist--ch9--msg35=还有更简单的——模组的"按预览跳过"功能。不按 Shift+WASD，而是按 Control+WASD。
messagelist--ch9--msg36=按此方式，每次移动的步长等于你手中对象的宽度或高度，不论地面如何。也尊重旋转。
messagelist--ch9--msg37=所以不用按很多键，只需连续 Control+D 点击，重复即可。
messagelist--ch9--msg38=放置蓝图时角色距离无关紧要，因为只是在放置幽灵。建成长线后，KK 可以替你完成剩余部分的建造。
messagelist--ch9--msg39=蓝图会自动处理树木——把它们标记为拆解。所以 KK 建造时会先清理区域。
messagelist--ch9--msg40=有了这些工具，你应该能完成供电设施了。
messagelist--ch9--msg41=电力不通电就没有用处。目前你能合成的唯一一定会耗电的物品是无障碍雷达（accessibility radar）。做一个用它测试供电系统。我们稍后会解释它的用途，但尽早放置并保持常开很重要。
messagelist--ch9--msg42=右键点击电线杆可以获得更多信息，包括满足率——衡量你是否满足机器电力需求的抽象指标。现在是时候搞清楚正常工作时是什么样子的。
messagelist--ch9--msg43=很快你需要扩展电力输出，也就是连更多锅炉和蒸汽机。如果知道正常工作状态，更容易识别问题或判断是否需要更多电力。
messagelist--ch9--meta=eJyrVkrOL80rUbIyMdZRykvMTVWyUkrOsFSqBQBmtAea

messagelist--crafting-menu-help--msg1=合成菜单显示你当前可以合成的物品。
messagelist--crafting-menu-help--msg2=左键单击配方会尝试立即合成该物品。
messagelist--crafting-menu-help--msg3=右键单击配方会打开详细信息，包括所需机器和材料。
messagelist--crafting-menu-help--msg4=搜索功能可用 Control + F 启用。
messagelist--crafting-menu-help--msg5=使用 Shift + 左键 一次合成5个，Control + Shift + 左键 尽可能多地合成。
messagelist--crafting-menu-help--msg6=按 K 可查看该物品可由哪些机器合成。
messagelist--crafting-menu-help--meta=eJyrVkrOL80rUbIy01HKS8xNVbJSSi5KTCvJzEvXzU3NK9XNSM0pUKoFAAREDWs=

messagelist--crafting-queue-help--msg1=合成队列显示正在等待合成的物品。
messagelist--crafting-queue-help--msg2=左键单击队列中的项目可取消单个合成。
messagelist--crafting-queue-help--msg3=Shift + 左键 取消5个。
messagelist--crafting-queue-help--msg4=Control + Shift + 左键 取消全部。
messagelist--crafting-queue-help--msg5=按 K 可查看当前队列项目的详细信息。
messagelist--crafting-queue-help--msg6=当合成速度较慢时，队列很长，此界面非常有用。
messagelist--crafting-queue-help--meta=eJyrVkrOL80rUbIy01HKS8xNVbJSSi5KTCvJzEvXLSxNLU3VzUjNKVCqBQAS6A3b

messagelist--debug-menu-help--msg1=调试菜单提供高级功能，如性能统计和实体信息。
messagelist--debug-menu-help--msg2=通常普通玩家不需要使用此菜单。
messagelist--debug-menu-help--msg3=按 Control + Alt + Shift + D 打开（如果已配置）。
messagelist--debug-menu-help--msg4=其中一些功能可能在未来版本中被移除或更改。
messagelist--debug-menu-help--msg5=此菜单仅供高级用户和问题排查使用。
messagelist--debug-menu-help--msg6=不要在生产环境中依赖此菜单的功能。
messagelist--debug-menu-help--msg7=如需帮助，请参考 GitHub 上的文档。
messagelist--debug-menu-help--meta=eJyrVkrOL80rUbIy11HKS8xNVbJSSklNKk3XzU3NK9XNSM0pUKoFANrhDCU=

messagelist--decider-combinator--msg1=决策组合器根据输入信号输出信号。
messagelist--decider-combinator--msg2=它比较两个输入值并根据条件返回结果。
messagelist--decider-combinator--msg3=左键单击打开配置界面。
messagelist--decider-combinator--msg4=使用 W/A/S/D 导航，Enter 确认选择。
messagelist--decider-combinator--msg5=红色信号表示 AND/≥/≤ 条件，绿色信号表示 OR/</> 条件。
messagelist--decider-combinator--msg6=可以同时设置红色和绿色条件。
messagelist--decider-combinator--msg7=常开和常闭模式可用于反转逻辑。
messagelist--decider-combinator--msg8=输入优先级决定当多个输入匹配时的选择。
messagelist--decider-combinator--msg9=输出可以是输入之一或常量值。
messagelist--decider-combinator--msg10=注意：输出引脚数量取决于配置的复杂度。
messagelist--decider-combinator--msg11=复杂配置可能有更多输出引脚。
messagelist--decider-combinator--msg12=简单配置通常只有少数几个输出。
messagelist--decider-combinator--msg13=如果不确定输出什么，按 K 查看当前配置。
messagelist--decider-combinator--msg14=此设备需要电路网络供电才能工作。
messagelist--decider-combinator--msg15=它可以作为逻辑门、比较器或选择器使用。
messagelist--decider-combinator--msg16=熟练掌握后可用于复杂自动化系统。
messagelist--decider-combinator--meta=eJyrVkrOL80rUbIyNNNRykvMTVWyUkpJTc5MSS3STc7PTcrMSyzJL1KqBQAM8A3B

messagelist--equipment-grid-help--msg1=装备栏显示你穿着的装甲和装备。
messagelist--equipment-grid-help--msg2=不同装甲有不同的装备槽位布局。
messagelist--equipment-grid-help--msg3=左键单击装备可穿上，右键单击可脱下。
messagelist--equipment-grid-help--msg4=装备有大小和形状，需要合适的位置放置。
messagelist--equipment-grid-help--msg5=太阳能板提供电力，电池储存电力。
messagelist--equipment-grid-help--msg6=个人 roboport 允许建筑机器人从你的装甲起飞。
messagelist--equipment-grid-help--msg7=模块化装甲提供额外装备槽位。
messagelist--equipment-grid-help--msg8=按 K 可查看当前装备的详细信息。
messagelist--equipment-grid-help--msg9=某些装备需要特定条件才能使用。
messagelist--equipment-grid-help--msg10=装备网格支持搜索功能以快速找到物品。
messagelist--equipment-grid-help--msg11=调整装备布局以达到最佳效率。
messagelist--equipment-grid-help--meta=eJyrVkrOL80rUbIyNNRRykvMTVWyUkotLM0syE3NK9FNL8pM0c1IzSlQqgUAHQ4OEg==

messagelist--general-ui-help--msg1=本模组的大部分 UI 遵循类似的设计模式。
messagelist--general-ui-help--msg2=主要导航按键：Tab 前进，Shift + Tab 后退。
messagelist--general-ui-help--msg3=Control + Tab 切换主标签页。
messagelist--general-ui-help--msg4=Control + Shift + Tab 反向切换主标签页。
messagelist--general-ui-help--msg5=E 关闭当前 UI 或返回上一级。
messagelist--general-ui-help--msg6=K 提供关于当前焦点对象的详细信息。
messagelist--general-ui-help--msg7=Y 在某些 UI 中显示物品的所有属性。
messagelist--general-ui-help--msg8=Shift + / 打开帮助菜单。
messagelist--general-ui-help--msg9=搜索通常通过 Control + F 启用。
messagelist--general-ui-help--msg10=按住 Shift 进行向下/向后导航。
messagelist--general-ui-help--msg11=按住 Control 进行快速操作如智能插入。
messagelist--general-ui-help--msg12=大多数 UI 支持鼠标右键查看更多详情。
messagelist--general-ui-help--msg13=使用方向键在列表项目中移动。
messagelist--general-ui-help--msg14=空格键通常在表单中触发默认操作。
messagelist--general-ui-help--msg15=Enter 确认选择或进入子菜单。
messagelist--general-ui-help--msg16=Escape 关闭当前对话框。
messagelist--general-ui-help--msg17=Backspace 返回上级或清除输入。
messagelist--general-ui-help--msg18=Delete 删除选中的项目。
messagelist--general-ui-help--msg19=Home 跳到列表开头，End 跳到结尾。
messagelist--general-ui-help--msg20=Page Up/Down 分页移动。
messagelist--general-ui-help--msg21=有些 UI 有额外的快捷键组合。
messagelist--general-ui-help--msg22=遇到问题时按 Shift + / 查看上下文帮助。
messagelist--general-ui-help--msg23=详细的按键映射请参考 mod 文档。
messagelist--general-ui-help--meta=eJyrVkrOL80rUbIyMtZRykvMTVWyUkpPzUstSszRLc3UzUjNKVCqBQDjugxT

messagelist--inventory-grid-help--msg1=物品栏网格显示容器中的所有物品。
messagelist--inventory-grid-help--msg2=左键单击物品将其拿起放入手中。
messagelist--inventory-grid-help--msg3=右键单击将物品的一半放入手中。
messagelist--inventory-grid-help--msg4=k 查看物品的更多信息。
messagelist--inventory-grid-help--msg5=Shift + 左键 将整个槽位移到目标。
messagelist--inventory-grid-help--msg6=Shift + 右键 将半槽位移到目标。
messagelist--inventory-grid-help--msg7=Control + 左键 智能地将手中物品放入最合适的地方。
messagelist--inventory-grid-help--msg8=Control + 右键 智能地放入半堆。
messagelist--inventory-grid-help--msg9=Q 清空手部物品。
messagelist--inventory-grid-help--msg10=Z 放下一件物品。
messagelist--inventory-grid-help--msg11=搜索功能通过 Control + F 启用，然后按 Enter/Shift+Enter 导航结果。
messagelist--inventory-grid-help--msg12=过滤功能可以通过点击过滤器图标设置。
messagelist--inventory-grid-help--msg13=按住 Ctrl 并使用 WASD 可向该方向移动尽可能远。
messagelist--inventory-grid-help--msg14=某些物品栏有锁定功能防止意外移动。
messagelist--inventory-grid-help--msg15=长按某个物品可以查看详情。
messagelist--inventory-grid-help--msg16=物品按类型和名称排序便于查找。
messagelist--inventory-grid-help--msg17=堆叠物品只显示一个条目但数量会累加。
messagelist--inventory-grid-help--msg18=非堆叠物品每个都有单独的条目。
messagelist--inventory-grid-help--msg19=当物品栏满时会有提示音提醒。
messagelist--inventory-grid-help--msg20=拖动物品时会有额外的反馈音。
messagelist--inventory-grid-help--msg21=物品颜色编码区分品质等级。
messagelist--inventory-grid-help--msg22=灰色表示低品质，绿色表示高品质。
messagelist--inventory-grid-help--msg23=蓝色通常是最高品质。
messagelist--inventory-grid-help--msg24=点击空格槽位可以快速访问空槽。
messagelist--inventory-grid-help--msg25=火箭货物装载上限由重量决定而非格子数：它只有物品占用的格子，末尾还有一个"添加到此处"格子，可以将手中的物品放入其中并显示装填进度。
messagelist--inventory-grid-help--meta=eJyrVkrOL80rUbIyMtVRykvMTVWyUsrMK0vNK8kvqtRNL8pM0c1IzSlQqgUAHuoOLQ==

messagelist--map-help--msg1=这是地图视图，允许你探索所在的地表。请注意此菜单具有上下文相关性，会对有特殊交互的项目显示更多信息。这些信息会显示在此消息上方，方便你查找。
messagelist--map-help--msg2=以下是基本控制的简要概述。有关完整的控制文档，请参考模组说明文件和原版异星工厂 wiki。
messagelist--map-help--msg3=并非所有按键都由本模组提供。异星工厂本身有很多未涵盖的按键。
messagelist--map-help--msg4=你有一个光标和一个角色。光标就像鼠标一样。角色就是你的身体。
messagelist--map-help--msg5=光标和角色是完全独立的，但角色必须靠近物体才能建造或配置它们。在原版中大约是10格距离。
messagelist--map-help--msg6=使用方向键行走。
messagelist--map-help--msg7=按 W、A、S、D 移动光标。
messagelist--map-help--msg8=你可以用 Shift + T 传送。这是作弊功能，但很多玩家认为这很公平，因为我们在其他方面更慢。
messagelist--map-help--msg9=当光标在一个实体上时，该实体被选中。
messagelist--map-help--msg10=按 K 获取关于选中实体或手中物品的更多信息。
messagelist--map-help--msg11=右方括号 ] 可提供关于选中实体的更多详细信息。
messagelist--map-help--msg12=按 Q 清空手部或执行取样器操作。按 Shift + Q 读取手中物品。
messagelist--map-help--msg13=按 Control + [ 将手中的整堆物品放入选中的实体。
messagelist--map-help--msg14=Control + ] 放入半堆。
messagelist--map-help--msg15=Z 只放下一件物品。
messagelist--map-help--msg16=通过把角色移到物品旁边按住 F 来拾取散落在地上的物品，或者用 X 键将其拆掉。
messagelist--map-help--msg17=如果想从传送带上拿东西，只能按住 F；用 X 会直接拆掉传送带。
messagelist--map-help--msg18=按 J 将光标移回角色位置，按 I 可切换行走时光标是否始终向前移动一格。
messagelist--map-help--msg19=在光标移动键（W/A/S/D）上按住 Shift 可以沿指定方向快速移动最多 100 格，遇到重要变化时会提前停下。
messagelist--map-help--msg20=按住 Control 配合光标键可以按照手中物品的宽度或高度移动光标，方便快速排成直线。
messagelist--map-help--msg21=按左方括号 [ 放置物品。
messagelist--map-help--msg22=按住 Shift + 左方括号可放置预告（ghost）。
messagelist--map-help--msg23=按住 X 进行开采。
messagelist--map-help--msg24=按 R 顺时针旋转物品。旋转的是手中物品还是当前选中的实体，取决于手中是否有物品。
messagelist--map-help--msg25=按住 Shift + R 逆时针旋转。
messagelist--map-help--msg26=H 和 V 分别用于水平翻转和垂直翻转。翻转与旋转 180 度并不完全相同。
messagelist--map-help--msg27=从这个界面可以进入多种 UI。
messagelist--map-help--msg28=按 E 打开主菜单（背包、制作、研究等），通常称为"主菜单"。
messagelist--map-help--msg29=按 Alt + V 打开快捷旅行菜单。
messagelist--map-help--msg30=按 Alt + W 打开世界菜单，可设置火车警报及其他功能。
messagelist--map-help--msg31=在解锁物流机器人后，按 Control + Alt + L 打开某个物品的物流界面。
messagelist--map-help--msg32=用左方括号 [ 点击实体即可打开其配置界面。注意有时需要先将手清空，以免与"快速替换"功能混淆（例如用更好的箱子覆盖更差的箱子时会自动替换）。
messagelist--map-help--msg33=本模组提供了一些轻量级辅助功能，帮助你定位方向。
messagelist--map-help--msg34=按 Shift + B 在当前光标位置放置书签，按 B 可将光标跳回该书签处。
messagelist--map-help--msg35=标尺呈十字形，当你穿过十字任意一条臂时会发出音频提示。
messagelist--map-help--msg36=按 Control + Alt + B 设置标尺。
messagelist--map-help--msg37=设置完成后四处走动并移动光标感受它的工作原理。
messagelist--map-help--msg38=按 Control + Shift + B 清除标尺。
messagelist--map-help--msg39=建造锁定是一个在你角色奔跑时自动在身后放置物品的功能。
messagelist--map-help--msg40=对于放置长条传送带这类操作特别有用。
messagelist--map-help--msg41=部分实体有特殊的建造锁定行为。最重要的是传送带，它会按照你奔跑的方向自动朝向。
messagelist--map-help--msg42=按 Control + B 启用建造锁定。
messagelist--map-help--msg43=如果撞上障碍物，建造锁定会自动关闭，因为引擎会将你推离原本规划的路线。
messagelist--map-help--msg44=同时使用建造锁定和标尺可以快速铺设长距离的传送带和管道，非常实用。
messagelist--map-help--msg45=以下是将工具放入手中的关键按键：
messagelist--map-help--msg46=按 Control + C 获取复制工具。
messagelist--map-help--msg47=按 Control + X 获取切除工具。
messagelist--map-help--msg48=按 Control + V 获得基于上次切除或复制内容的临时蓝图。
messagelist--map-help--msg49=按 Alt + B 获取永久空白蓝图。
messagelist--map-help--msg50=按 Alt + D 获取拆除规划器。
messagelist--map-help--msg51=按 Alt + U 获取升级规划器。
messagelist--map-help--msg52=按 Control + Alt + Shift + B 获取蓝图书。
messagelist--map-help--msg53=有关驾驶、高级功能和战斗相关的控制说明，请参阅 GitHub 上的模组文档。
messagelist--map-help--meta=eJyrVkrOL80rUbIyNdZRykvMTVWyUspNLNDNSM0pUKoFAJQxCas=

messagelist--menu-help--msg1=主菜单包含多个标签页。
messagelist--menu-help--msg2=使用 Control + Tab 在主标签页间切换。
messagelist--menu-help--msg3=使用 Tab 在子标签页间切换。
messagelist--menu-help--msg4=按 E 关闭菜单返回游戏。
messagelist--menu-help--meta=eJyrVkrOL80rUbIy0VHKS8xNVbJSyk3NK9XNSM0pUKoFAJeJCe4=

messagelist--research-menu-help--msg1=研究菜单显示可用的科技树。
messagelist--research-menu-help--msg2=有三行：可研究的、已锁定的、已研究过的。
messagelist--research-menu-help--msg3=W 和 S 切换行，A 和 D 在行内移动。
messagelist--research-menu-help--msg4=按 K 查看科技的解锁条件和奖励。
messagelist--research-menu-help--msg5=自动解锁的科技无需手动选择。
messagelist--research-menu-help--msg6=手动选择的科技需要消耗科学包。
messagelist--research-menu-help--msg7=研究完成后会自动解锁新配方和能力。
messagelist--research-menu-help--msg8=某些科技需要前置科技才能解锁。
messagelist--research-menu-help--msg9=已锁定的科技显示为什么不可用。
messagelist--research-menu-help--msg10=使用搜索功能快速找到特定科技。
messagelist--research-menu-help--msg11=研究队列显示正在进行和等待的研究。
messagelist--research-menu-help--msg12=可以取消等待中的研究。
messagelist--research-menu-help--msg13=完成所有科技后即可建造火箭发射井。
messagelist--research-menu-help--meta=eJyrVkrOL80rUbIyNNZRykvMTVWyUipKLU5NLErO0M1NzSvVzUjNKVCqBQANLg2Y

messagelist--research-queue-help--msg1=研究队列显示当前正在进行和等待的研究。
messagelist--research-queue-help--msg2=左键单击可取消单个研究任务。
messagelist--research-queue-help--msg3=Shift + 左键 取消5个等待任务。
messagelist--research-queue-help--msg4=Control + Shift + 左键 取消全部等待任务。
messagelist--research-queue-help--msg5=按 K 查看当前研究的进度和剩余时间。
messagelist--research-queue-help--msg6=研究速度受实验室数量和类型影响。
messagelist--research-queue-help--msg7=科学包会通过机械臂自动送入实验室。
messagelist--research-queue-help--msg8=队列满时新的研究会排在后面。
messagelist--research-queue-help--msg9=紧急情况可以中断当前研究重新开始。
messagelist--research-queue-help--msg10=研究进度可以随时保存和恢复。
messagelist--research-queue-help--meta=eJyrVkrOL80rUbIyNNBRykvMTVWyUipKLU5NLErO0C0sTS1N1c1IzSlQqgUAG6IOBQ==

messagelist--spidertron-remote-protohelp--msg1=这是一台蜘蛛车遥控器，用于控制一台或多台蜘蛛车。
messagelist--spidertron-remote-protohelp--msg2=要将蜘蛛车添加到遥控器，将光标移到有蜘蛛车的 tile 上并按右括号 ]。再按一次已链接的蜘蛛车上的右括号可解除链接。
messagelist--spidertron-remote-protohelp--msg3=要打开菜单选择多台蜘蛛车，按 Alt + 右括号 ]。此菜单显示你势力相关地表中所有蜘蛛车。
messagelist--spidertron-remote-protohelp--msg4=要从遥控器移除所有蜘蛛车，按 Control + Backspace。
messagelist--spidertron-remote-protohelp--msg5=要将光标位置添加到所有蜘蛛车的自动驾驶队列，按左括号 [。这会在现有队列中添加一个航路点。
messagelist--spidertron-remote-protohelp--msg6=要清空自动驾驶队列并设置新目的地，按 Shift + 左括号 [。这会用光标位置替换所有现有航路点。
messagelist--spidertron-remote-protohelp--msg7=要仅清空自动驾驶队列而不设置新目的地，按 Backspace。
messagelist--spidertron-remote-protohelp--msg8=要循环切换遥控器上的蜘蛛车，使用 M 和句点。光标会移动到每台蜘蛛车并播报 tile 信息。
messagelist--spidertron-remote-protohelp--msg9=注意：移动蜘蛛车后，它们经常会聚集在同一 tile 上，可能看起来没有正常工作。我们希望在后续版本改进这一点。
messagelist--spidertron-remote-protohelp--meta=eJyrVkrOL80rUbKy1FHKS8xNVbJSKi7ITEktKinKz9MtSs3NL0nVLSjKL8nPSM0pUKoFAJiFEXU=

messagelist--trains-overview-help--msg1=火车总览显示所有火车的状态和位置。
messagelist--trains-overview-help--msg2=每行代表一辆火车及其当前任务。
messagelist--trains-overview-help--msg3=按 K 查看某辆火车的详细信息。
messagelist--trains-overview-help--msg4=使用 W/S 在不同火车间移动。
messagelist--trains-overview-help--msg5=按 A/D 查看某火车的车厢列表。
messagelist--trains-overview-help--msg6=信号系统和车站调度对于高效运营至关重要。
messagelist--trains-overview-help--msg7=时刻表控制火车在各站的停留时间。
messagelist--trains-overview-help--msg8=警告菜单会通知轨道堵塞或等待情况。
messagelist--trains-overview-help--msg9=右键单击可查看更详细的路径规划。
messagelist--trains-overview-help--msg10=火车是运输大量物资的最高效方式。
messagelist--trains-overview-help--msg11=合理规划站点和时刻表可以大幅提高物流效率。
messagelist--trains-overview-help--msg12=注意保持轨道畅通避免连环拥堵。
messagelist--trains-overview-help--msg13=使用音频标尺辅助精确停靠。
messagelist--trains-overview-help--msg14=多 train 同时运行需要良好的调度策略。
messagelist--trains-overview-help--msg15=学习信号系统用法可以避免许多常见问题。
messagelist--trains-overview-help--msg16=时刻表编辑器可以用来设置复杂的停靠规则。
messagelist--trains-overview-help--meta=eJyrVkrOL80rUbIyNNNRykvMTVWyUiopSszMK9bNL0stKstMLdfNSM0pUKoFAC1QDqE=

messagelist--warnings-menu-help--msg1=警告菜单显示当前重要的游戏状态通知。
messagelist--warnings-menu-help--msg2=主要警告包括：缺电、工厂拥堵、敌人接近等。
messagelist--warnings-menu-help--msg3=按 P 打开警告菜单。
messagelist--warnings-menu-help--msg4=每个警告可以点击查看详情。
messagelist--warnings-menu-help--msg5=重要警告会有特殊的提示音。
messagelist--warnings-menu-help--msg6=某些警告只在特定条件下出现。
messagelist--warnings-menu-help--msg7=解决根本问题后警告会自动消失。
messagelist--warnings-menu-help--msg8=定期检查警告菜单有助于维持工厂稳定运行。
messagelist--warnings-menu-help--meta=eJyrVkrOL80rUbKy0FHKS8xNVbJSKk8sysvMSy/WzU3NK9XNSM0pUKoFAAZcDYg=

