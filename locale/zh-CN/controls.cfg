 [control-keys]
 ]=右括号
 ^=插入符
 left-bracket=左括号
 
 [controls]
 fa-s-v=循环切换附近载具（Shift+V）
 fa-a-w=世界菜单（Alt+W）
 fa-cas-d=调试菜单（Ctrl+Alt+Shift+D）
 fa-cas-m=设置菜单（Ctrl+Alt+Shift+M）
 fa-cs-i=切换战斗模式（Ctrl+Shift+I）
 fa-c-r=切换最强/最近瞄准（Ctrl+R）
 fa-s-r=切换优先刷怪点瞄准（Shift+R）
 fa-cs-r=切换安全模式瞄准（Ctrl+Shift+R）
 fa-ca-c=切换隐藏光标（Ctrl+Alt+C）
 fa-c-l=打开物流配置（Ctrl+L）
 fa-backspace=清空字段（Backspace）
 fa-c-backspace=删除蓝图/规划器（Ctrl+Backspace）
 fa-s-slash=切换帮助（Shift+/）
 fa-minus=减少物品栏（-）
 fa-equals=增加物品栏（+）
 fa-c-minus=设置物品栏最小值（Ctrl+-）
 fa-c-equals=设置物品栏最大值（Ctrl++）
 fa-s-minus=减少物品栏5格（Shift+-）
 fa-s-equals=增加物品栏5格（Shift++）
 fa-c-m=左侧放置连锁信号（Ctrl+M）
 fa-s-m=左侧放置常规信号（Shift+M）
 fa-c-dot=右侧放置连锁信号（Ctrl+.）
 fa-s-dot=右侧放置常规信号（Shift+.）
 fa-n=电路网络即时邻居（N）
 fa-j=切换条件类型（J）
 fa-a-n=从实体移除线路（Alt+N）
 fa-s-n=电路网络导航器（Shift+N）
 fa-a-f=播报机器人派遣状态（Alt+F）
 fa-a-p=原型列表器（Alt+P）
 fa-a-leftbracket=协助海上泵放置、设置或清除分拣机/机械臂过滤器、Syntrax输入（Alt+[）
