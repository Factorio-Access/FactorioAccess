 tutorial-ch12-bp-splitter=四边都连接传送带的分拣机
 tutorial-ch12-bp-double-sideload=双重侧向装载示例
 tutorial-ch12-bp-sideload-instead-of-corner=侧向装载而非拐角效果的示例
 tutorial-ch12-bp-tileable-drill-setup=4台钻机的可铺排采矿方案，使用传送带侧向装载在4台钻机中间塞入电线杆
 tutorial-ch12-furnace=使用本章大部分功能的熔炉方案，填满输出传送带的两车道。注意：地下传送带成本较高，试着设计更优的方案！
