 [fa]
 # 时刻表读取
 # 由 schedule-reader.lua 用于描述列车和站台时刻表
 
 # 连接词
 schedule-connector-and=和
 schedule-connector-or=或
 
 # 时刻表记录部分
 schedule-station=__1__
 schedule-rail-position=轨道位置
 schedule-no-destination=无目的地
 schedule-temporary=临时
 schedule-from-interrupt=中断后
 schedule-waiting-for=等待中
 
 # 时间相关条件
 schedule-time=等待 __1__ 秒
 schedule-inactivity=无活动 __1__ 秒
 
 # 货物/物品栏条件
 schedule-full=货舱已满
 schedule-empty=货舱为空
 schedule-not-empty=有货物
 schedule-contents-condition-not-configured=内容条件未配置
 
 # 燃料条件
 schedule-fuel-all=加注全部
 schedule-fuel-any=加注任意
 schedule-fuel-full=燃料满
 
 # 电路条件
 schedule-circuit=电路
 
 # 机器人条件
 schedule-robots-inactive=机器人不活跃
 
 # 乘客条件
 schedule-passenger-present=有乘客
 schedule-passenger-not-present=无乘客
