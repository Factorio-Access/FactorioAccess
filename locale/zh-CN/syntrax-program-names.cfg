 ; Syntrax程序名称，用于铁轨规划器菜单
 ; 参见 scripts/ui/menus/rail-builder.lua 的使用方式
 
 [fa]
 ; 分类标签
 syntrax-category-turns=转弯
 syntrax-category-forks=分岔
 syntrax-category-signals=信号对
 syntrax-category-custom=自定义程序
 
 ; 转弯程序
 syntrax-left-45=左45度
 syntrax-right-45=右45度
 syntrax-left-90=左90度
 syntrax-right-90=右90度
 
 ; 分岔程序
 syntrax-fork-straight-left-45=直行并左45度分岔
 syntrax-fork-straight-right-45=直行并右45度分岔
 syntrax-fork-straight-left-90=直行并左90度分岔
 syntrax-fork-straight-right-90=直行并右90度分岔
 syntrax-split-45=45度分岔
 syntrax-split-90=90度分岔
 
 ; 信号程序
 syntrax-signal-pair=一对信号机
 syntrax-chain-pair=一对连锁信号机
 syntrax-signal-right=右侧信号机
 syntrax-chain-right=右侧连锁信号机
 syntrax-signal-left=左侧信号机
 syntrax-chain-left=左侧连锁信号机
 syntrax-signal-blocked=信号机已关闭
 syntrax-chain-signal-ok=连锁信号机开启
 syntrax-signal-ok=信号机已开放
 syntrax-stop=停止
 syntrax-go=继续
