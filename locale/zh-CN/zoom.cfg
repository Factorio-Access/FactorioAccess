 [fa]
 # 缩放控制消息
 zoom-set=已缩放到 __1__ 格
 zoom-limited=尝试缩放到 __1__ 格，但你的缩放限制阻止了该操作
 zoom-at-max=最大缩小为 __1__ 格
 zoom-at-min=最大放大为 __1__ 格
 zoom-current=当前缩放为 __1__ 格
 
 # Alt+Z状态武器信息
 zoom-weapon-with-ammo=携带 __1__
 zoom-weapon-range=射程 __1__
 zoom-weapon-range-with-min=射程 __1__ 到 __2__
 zoom-no-weapon=无武器
