 # 铁轨播报本地化
 # 配合：
 # - railutils/rail-describer.lua（生成描述）
 # - scripts/rails/announcer.lua（从描述构建消息）
 
 [fa]
 # 简单铁轨类型
 rails-descriptions-vertical=垂直
 rails-descriptions-horizontal=水平
 
 # 半对角和对角铁轨（12个方向）
 rails-descriptions-northnortheast=北偏东北
 rails-descriptions-northeast=东北
 rails-descriptions-eastnortheast=东偏东北
 rails-descriptions-eastsoutheast=东偏东南
 rails-descriptions-southeast=东南
 rails-descriptions-southsoutheast=南偏东南
 rails-descriptions-southsouthwest=南偏西南
 rails-descriptions-southwest=西南
 rails-descriptions-westsouthwest=西偏西南
 rails-descriptions-westnorthwest=西偏西北
 rails-descriptions-northwest=西北
 rails-descriptions-northnorthwest=北偏西北
 
 # 曲线铁轨回退
 rails-descriptions-left-of-north=北侧左侧
 rails-descriptions-right-of-north=北侧右侧
 rails-descriptions-left-of-east=东侧左侧
 rails-descriptions-right-of-east=东侧右侧
 rails-descriptions-left-of-south=南侧左侧
 rails-descriptions-right-of-south=南侧右侧
 rails-descriptions-left-of-west=西侧左侧
 rails-descriptions-right-of-west=西侧右侧
 
 # Curve-b：对角线左右
 rails-descriptions-left-of-northeast=东北侧左侧
 rails-descriptions-right-of-northeast=东北侧右侧
 rails-descriptions-left-of-southeast=东南侧左侧
 rails-descriptions-right-of-southeast=东南侧右侧
 rails-descriptions-left-of-southwest=西南侧左侧
 rails-descriptions-right-of-southwest=西南侧右侧
 rails-descriptions-left-of-northwest=西北侧左侧
 rails-descriptions-right-of-northwest=西北侧右侧
 
 # 90度转弯位置
 rails-descriptions-top-of-east-to-north-turn=东西向北转顶部
 rails-descriptions-upper-half-of-east-to-north-turn=东西向北转上半部
 rails-descriptions-lower-half-of-east-to-north-turn=东西向北转下半部
 rails-descriptions-bottom-of-east-to-north-turn=东西向北转底部
 rails-descriptions-top-of-east-to-south-turn=东西向南转顶部
 rails-descriptions-upper-half-of-east-to-south-turn=东西向南转上半部
 rails-descriptions-lower-half-of-east-to-south-turn=东西向南转下半部
 rails-descriptions-bottom-of-east-to-south-turn=东西向南转底部
 rails-descriptions-top-of-west-to-north-turn=东西向北转顶部
 rails-descriptions-upper-half-of-west-to-north-turn=东西向北转上半部
 rails-descriptions-lower-half-of-west-to-north-turn=东西向北转下半部
 rails-descriptions-bottom-of-west-to-north-turn=东西向北转底部
 rails-descriptions-top-of-west-to-south-turn=东西向南转顶部
 rails-descriptions-upper-half-of-west-to-south-turn=东西向南转上半部
 rails-descriptions-lower-half-of-west-to-south-turn=东西向南转下半部
 rails-descriptions-bottom-of-west-to-south-turn=东西向南转底部
 
 # 修饰符
 rail-ghost-prefix=幽灵
 rail-end-direction=__1__ 端
 rail-lonely=孤立
 
 # 交叉口描述
 rail-junction-split=__1__ 处分叉
 rail-junction-fork-left=__1__ 处左分岔
 rail-junction-fork-right=__1__ 处右分岔
 rail-junction-fork-both=__1__ 处三岔口
 
 # 信号机描述
 rail-signal-out=信号机出 __1__
 rail-signal-in=信号机入自 __1__
 rail-chain-out=连锁信号机出 __1__
 rail-chain-in=连锁信号机入自 __1__
 rail-signal-pair=信号对 __1__
 rail-chain-pair=连锁信号对 __1__
 rail-pair-chained-left=信号对 __1__ 左链
 rail-pair-chained-right=信号对 __1__ 右链
 
 # 站点
 rail-at-station=在车站
 
 # 停车预览
 stop-preview-gap-after-car=__1__ 在第 __2__ 节车厢后
 stop-preview-car-position=__1__ 第 __2__ 节车厢位置 __3__
