[package]
name = "factorio-access-installer"
version = "0.1.0"
edition = "2021"
description = "Factorio Access installer: installs one release's mod zip and native DLLs into a Factorio install and applies the recommended config changes"

[[bin]]
name = "FactorioAccessInstaller"
path = "src/main.rs"

[dependencies]
wxdragon = "0.9"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
zip = "2"
semver = "1"
dirs = "6"
winreg = "0.55"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
